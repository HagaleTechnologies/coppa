# cargo-about configuration for THIRD-PARTY-LICENSES.txt in every release
# archive (COP-47, .github/workflows/release.yml, job `notices`).
#
# `accepted` mirrors deny.toml's [licenses] allow list and must change with it.
# `targets` are the release targets (the macOS universal binary holds both
# Apple targets), matching deny.toml's [graph] targets.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
