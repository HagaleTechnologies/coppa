version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    cooldown:
      default-days: 4   # skip releases younger than 4 days (pulled/yanked releases, fresh supply-chain attacks)
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 4
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
