name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace

  test-features:
    name: Test with Features (fast, lib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --features cpal-backend,websocket --lib
      - run: cargo check --workspace --no-default-features

  test-full:
    name: Full test suite
    needs: [codex-clean]
    # codex-clean can legitimately report `skipped` (a draft PR,
    # dependabot[bot] PR, or non-pull_request event -- credenza's
    # codex-clean-gate.yml's own eligibility `if:`), which is a DIFFERENT
    # case from "ran and found the round not clean yet" (that produces
    # `failure`, never `skipped`). Both `success` and `skipped` mean
    # "proceed" -- only `failure`/`cancelled` mean "stop." Built in from
    # round 1, not as a same-day emergency follow-up (see cqdx#400 /
    # reference_codex_clean_gate_skip_vs_success_semantics.md).
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --features cpal-backend,websocket

  bench-fuzz:
    name: Bench & Fuzz Compilation
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check benchmarks compile
        run: cargo bench --no-run --workspace
      - name: Check fuzz targets compile
        run: cd fuzz && cargo check

  clippy:
    name: Clippy
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: MSRV Check
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace

  platform:
    name: Platform Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace
      - run: cargo test --workspace --lib
      - name: Test cpal-backend on macOS/Windows
        if: runner.os != 'Linux'
        run: cargo test -p coppa-audio --lib --features cpal-backend

  # codex-clean gate: defers test-full/bench-fuzz/clippy/msrv/deny/audit
  # (Task 2 also moves all six to the self-hosted rigel pool) until wait-for-codex.yml (Task 1,
  # now a caller stub around credenza's reusable wait-for-codex-review.yml)
  # signals this exact revision's Codex round raised nothing new.
  # gate_timeout_minutes: 95 is derived from THIS repo's own wait-for-codex
  # job timeout (75min, see wait-for-codex.yml) -- not copied from another
  # repo. producer_workflow_path points at THIS repo's own wait-for-codex.yml
  # (Task 1's stub), which credenza's bootstrap check reads at the base
  # branch's SHA to distinguish "not bootstrapped yet" (a clean 404) from
  # "genuinely not clean yet" (the file exists, poll normally).
  codex-clean:
    uses: HagaleTechnologies/credenza/.github/workflows/codex-clean-gate.yml@3ee4adf4944a5c5645a3c5ce248fd4e77a6f10da
    permissions:
      contents: read
      pull-requests: read
    with:
      exclude_dependabot: true
      gate_timeout_minutes: 95
      producer_workflow_path: .github/workflows/wait-for-codex.yml

  # New job (coppa had no prior queue-stall watchdog of any kind). Watches
  # whether ANY of the six codex-clean-gated jobs below is still queued
  # (never assigned a runner) 20 minutes after codex-clean opened the gate --
  # GitHub Actions has no built-in timeout for a job stuck in `queued`
  # (timeout-minutes only starts once a runner picks it up), so a
  # rigel pool outage/saturation would otherwise block this PR
  # indefinitely with no clear diagnostic. Never runs on rigel itself
  # -- it must not compete for the pool it's watching.
  rigel-jobs-queue-watchdog:
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - name: Fail fast if any gated job never leaves the queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry-on-transient-failure: a rate-limit/transient API failure
          # here must not abort the whole watchdog under bash -e's default
          # behavior before it ever checks status.
          check_statuses() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '[.jobs[] | select(.name=="Full test suite" or .name=="Bench & Fuzz Compilation" or .name=="Clippy" or .name=="MSRV Check" or .name=="Supply-chain check (cargo-deny)" or .name=="Security Audit") | {name, status}]' 2>&1)"; then
                printf '%s' "$out"
                return 0
              fi
              sleep 2
            done
            echo "::warning::transient gh api failure fetching job statuses (3 attempts) -- treating this poll as inconclusive" >&2
          }
          deadline=1200
          while [ "$SECONDS" -lt "$deadline" ]; do
            statuses="$(check_statuses)"
            still_queued="$(echo "$statuses" | jq '[.[] | select(.status == "queued")] | length' 2>/dev/null || echo "0")"
            if [ "$still_queued" -eq 0 ]; then
              echo "All six gated jobs have left the queue (running, completed, or correctly skipped) -- watchdog stands down."
              exit 0
            fi
            sleep 20
          done
          statuses="$(check_statuses)"
          still_queued_names="$(echo "$statuses" | jq -r '[.[] | select(.status == "queued") | .name] | join(", ")' 2>/dev/null || echo "unknown")"
          echo "::error::Still queued after 20 minutes with no runner assigned: $still_queued_names -- rigel pool likely saturated or down. See reference_rigel_ci_resource_contention_timeout.md for the diagnostic pattern (ssh rigel \"uptime; ...\")."
          exit 1

  deny:
    name: Supply-chain check (cargo-deny)
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    name: Security Audit
    needs: [codex-clean]
    if: needs.codex-clean.result == 'success' || needs.codex-clean.result == 'skipped'
    runs-on: [self-hosted, linux, rigel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  wiki-lint:
    name: Wiki lint
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Clone sunto
        env:
          SUNTO_TOKEN: ${{ secrets.SUNTO_RO_TOKEN }}
        run: git clone "https://x-access-token:${SUNTO_TOKEN}@github.com/HagaleTechnologies/sunto.git" /tmp/sunto
      - name: Lint wiki
        run: python3 /tmp/sunto/bin/wiki-lint wiki/

  # Summary gate for branch protection. bench-fuzz and platform are excluded:
  # bench-fuzz is compile-only (slow, no test signal) and platform is a matrix
  # job that duplicates linux coverage already in test-full/test-features.
  ci:
    name: CI
    needs:
      [
        check,
        test-features,
        test-full,
        clippy,
        fmt,
        msrv,
        deny,
        audit,
        wiki-lint,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All CI checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -q '"failure"\|"cancelled"'; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"
