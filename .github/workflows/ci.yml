name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review explicit (not just GitHub's default opened/
    # synchronize/reopened): a draft PR promoted to ready needs a fresh
    # CI run so the newly-added codex-clean gate and its six downstream
    # jobs actually execute before the PR becomes merge-eligible --
    # wait-for-codex.yml already handles this event (its own on: block
    # includes ready_for_review), so without this, promoting a draft
    # reruns only the Codex check while ci.yml stays silent, leaving
    # Mergify able to queue the PR on a stale CI result from before the
    # gated jobs ever ran.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # pull-requests: read is narrowed further at the job level below
  # (codex-clean) -- a job's own permissions: block can only be a SUBSET
  # of what's granted here, never wider. Without this scope present at
  # this top level, GitHub rejects the whole workflow file at parse time
  # (zero jobs created, no per-job error) the moment that job requests a
  # scope this block doesn't grant -- confirmed live on coppa PR #90.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace

  test-features:
    name: Test with Features (fast, lib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --features cpal-backend,websocket --lib
      - run: cargo check --workspace --no-default-features

  test-full:
    name: Full test suite
    needs: [codex-clean]
    # Job-level if: is unconditional (always()), not a bare success/skipped
    # check: GitHub Actions auto-skips a job whenever any of its `needs`
    # jobs was itself skipped, REGARDLESS of a custom if: expression,
    # unless that if: includes a status-check function -- without
    # always() here, codex-clean reporting `skipped` (the draft/
    # dependabot[bot] case this whole tolerance exists to handle) would
    # silently skip this job too, never actually running it. The first
    # step below then does the real success/skipped/failure decision
    # explicitly: a genuine codex-clean FAILURE must produce a real
    # `failure` conclusion here, not `skipped` -- Mergify's own
    # check-skipped tolerance in .mergify.yml would otherwise treat a
    # non-converged review as a legitimate skip and auto-merge anyway.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --features cpal-backend,websocket

  bench-fuzz:
    name: Bench & Fuzz Compilation
    needs: [codex-clean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check benchmarks compile
        run: cargo bench --no-run --workspace
      - name: Check fuzz targets compile
        run: cd fuzz && cargo check

  clippy:
    name: Clippy
    needs: [codex-clean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: MSRV Check
    needs: [codex-clean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace

  platform:
    name: Platform Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace
      - run: cargo test --workspace --lib
      - name: Test cpal-backend on macOS/Windows
        if: runner.os != 'Linux'
        run: cargo test -p coppa-audio --lib --features cpal-backend

  # codex-clean gate: defers test-full/bench-fuzz/clippy/msrv/deny/audit
  # until wait-for-codex.yml signals this exact revision's Codex round
  # raised nothing new -- avoids burning CI wall-clock time on premature
  # runs while a review is still in flight. The 95-minute timeout budget
  # is derived from THIS repo's own wait-for-codex job timeout (75min,
  # see wait-for-codex.yml) -- not copied from another repo; it must
  # exceed that bound with margin so a legitimately-still-working Codex
  # round never times out here first.
  codex-clean:
    name: Codex review clean (gate before expensive downstream jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      pull-requests: read
    # exclude_dependabot + draft-PR skip, mirroring wait-for-codex.yml's own
    # eligibility check -- belt-and-suspenders against that producer-side
    # skip logic ever drifting from this consumer-side one.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: "Bootstrap check: does the base branch have wait-for-codex.yml's label mechanism yet?"
        id: bootstrap-check
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # wait-for-codex.yml is pull_request_target, which ALWAYS
          # executes the BASE branch's copy, never the PR's own -- so the
          # PR that first wires this mechanism up can never produce a
          # label for its own pushes until it merges. Pinned to base.sha
          # (the event-fixed commit), not base.ref (a moving branch tip).
          #
          # A clean HTTP 404 (the file genuinely doesn't exist at this
          # SHA -- this IS the bootstrap PR) is the ONLY fetch-side
          # outcome allowed to pass through; every OTHER fetch failure
          # (transient network error, 403, 5xx) fails the gate closed
          # rather than silently treating a real API problem as "not
          # live yet, skip."
          #
          # Content, not mere existence: coppa's wait-for-codex.yml
          # pre-dated this codex-clean gate, so it always existed at every
          # reachable base SHA even before the label mechanism was added
          # -- an existence-only check would have been a structural
          # no-op, always resolving "ready" regardless of whether
          # apply_clean_label() was actually there yet (this exact gap
          # bit watchfinder's own migration; fixed here from round 1).
          # Grep the raw content for the function name itself.
          err_file="$(mktemp)"
          if content="$(gh api "repos/$REPO/contents/.github/workflows/wait-for-codex.yml?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw" 2>"$err_file")"; then
            if echo "$content" | grep -q "apply_clean_label"; then
              echo "bootstrap_status=ready" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base branch's wait-for-codex.yml at $BASE_SHA has no apply_clean_label() yet -- this is the bootstrap PR itself. Passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            fi
          else
            err="$(cat "$err_file")"
            if echo "$err" | grep -qiE "HTTP 404|not found"; then
              echo "::warning::Base branch has no wait-for-codex.yml at $BASE_SHA (clean 404) -- this is the bootstrap PR itself. Passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_status=fetch-failed" >> "$GITHUB_OUTPUT"
              echo "::error::Could not determine whether base branch has wait-for-codex.yml (non-404 failure fetching $BASE_SHA, failing closed): $err"
              exit 1
            fi
          fi

      - name: Pass through -- not a synchronize event, or bootstrap not yet live on the base branch
        if: github.event.action != 'synchronize' || steps.bootstrap-check.outputs.bootstrap_status == 'absent'
        run: echo "Passing through (event action=${{ github.event.action }}, bootstrap_status=${{ steps.bootstrap-check.outputs.bootstrap_status }}) -- no prior round to converge on, or this is the bootstrap PR itself."

      - name: Poll for the codex-clean label on this exact revision
        if: github.event.action == 'synchronize' && steps.bootstrap-check.outputs.bootstrap_status == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="codex-clean:${HEAD_SHA:0:12}"
          # In-script deadline runs a fixed 7-minute margin under this
          # job's own 95-minute timeout-minutes, leaving slack for the
          # loop to notice and error out cleanly before GitHub kills the
          # job outright.
          END=$((SECONDS + 95 * 60 - 420))
          while [ $SECONDS -lt $END ]; do
            # per_page=100: labels accumulate one per round with no
            # cleanup (deleting a stale label is itself a race that can
            # delete a newer revision's already-valid one), so a long
            # review loop can push the current label past the REST
            # default page size of 30.
            if labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name]' 2>/dev/null); then
              if echo "$labels" | jq -e --arg l "$target" 'index($l) != null' >/dev/null 2>&1; then
                echo "Found $target -- this round raised nothing new, safe to run the jobs gated behind this one."
                exit 0
              fi
            fi
            echo "Still waiting for $target..."
            sleep 20
          done
          echo "::error::$target never appeared within the gate's timeout budget -- this revision's Codex round either hasn't converged or the label failed to apply. See wait-for-codex.yml's own run for this SHA."
          exit 1

  deny:
    name: Supply-chain check (cargo-deny)
    needs: [codex-clean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    name: Security Audit
    needs: [codex-clean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail explicitly (not silently skip) if codex-clean did not pass
        run: |
          result="${{ needs.codex-clean.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::codex-clean gate result was '$result', not success or skipped -- failing explicitly so Mergify's check-skipped tolerance can't mistake this for a legitimate skip."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  wiki-lint:
    name: Wiki lint
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Clone sunto
        env:
          SUNTO_TOKEN: ${{ secrets.SUNTO_RO_TOKEN }}
        run: git clone "https://x-access-token:${SUNTO_TOKEN}@github.com/HagaleTechnologies/sunto.git" /tmp/sunto
      - name: Lint wiki
        run: python3 /tmp/sunto/bin/wiki-lint wiki/

  # Summary gate for branch protection. bench-fuzz and platform are excluded:
  # bench-fuzz is compile-only (slow, no test signal) and platform is a matrix
  # job that duplicates linux coverage already in test-full/test-features.
  ci:
    name: CI
    needs:
      [
        check,
        test-features,
        test-full,
        clippy,
        fmt,
        msrv,
        deny,
        audit,
        wiki-lint,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All CI checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -q '"failure"\|"cancelled"'; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"
