name: CI

# HAG-78: fast, ALWAYS-ON checks only -- unrelated to the Codex gate, never blocked behind it.
# check/test-features/fmt/platform have no PR-controlled-secret exposure and are cheap, so they
# still run immediately on every push, exactly as before this migration.
#
# The former codex-clean-gated jobs (test-full, bench-fuzz, clippy, msrv, deny, audit,
# wiki-lint, plus COP-90's semver) live in ci-full.yml, which only runs via workflow_dispatch once
# wait-for-codex.yml's event-driven gate confirms a revision clean -- see that file's own
# header for the full architecture. This file no longer produces the required "CI" check at
# all: ci-full.yml's own fan-in job owns that name now (Checks-API-managed, attached explicitly
# to the reviewed head_sha), and its own verdict computation cross-checks these fast jobs'
# native check-run results for that same SHA before declaring success -- see its "Check all
# jobs" step for why. This file's own jobs stay individually visible (fast human feedback on
# any PR) but are not themselves a required status check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge-queue entry needs these fast checks validated against its own synthetic SHA too --
  # ci-full.yml's own fan-in cross-checks this file's native check-run results for the same SHA
  # before declaring the required "CI" check successful (see that file's own comment), so this
  # file must actually run there or that cross-check finds nothing and fails closed.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # COP-47: no libudev-dev. serialport builds without its libudev feature,
      # so the --all-features check and rustdoc below prove none is needed.
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace
      - run: cargo check --workspace --all-features
      # COP-88: rustdoc must stay warning-free (broken intra-doc links, links
      # to private items, stray HTML tags).
      - name: rustdoc with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      # COP-90 (H-136): the library crates compile for the browser target.
      # coppa-channel is left out (getrandom needs the wasm_js feature).
      # Compiling is not running: see coppa-protocol's "Portability" docs.
      - name: Library crates compile for wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown -p coppa-dsp -p coppa-codec -p coppa-protocol -p coppa-ml -p coppa-engine
      # COP-63: a per-crate aarch64-linux build of the CLI or daemon must not
      # reach alsa-sys unless the crate's own cpal-backend feature asks for it.
      # The --workspace checks cannot see this, because they build coppa-audio
      # with its own default features. cargo tree needs no aarch64 std.
      - name: CLI and daemon do not pull in alsa-sys on aarch64-linux
        run: |
          tree=$(cargo tree --target aarch64-unknown-linux-gnu -p coppa-cli -p coppa-daemon --prefix none --format '{p}')
          if grep -q '^alsa-sys ' <<<"$tree"; then
            echo "::error::coppa-cli or coppa-daemon pulls in alsa-sys on aarch64-linux with its own cpal-backend feature off; depend on coppa-audio with default-features = false"
            cargo tree --target aarch64-unknown-linux-gnu -p coppa-cli -p coppa-daemon -i alsa-sys
            exit 1
          fi
      # COP-47: the release binaries cross-build for three Linux targets with
      # no libudev in the sysroot, and coppa never lists serial ports, so
      # serialport must keep its libudev feature off.
      - name: serial-ptt does not pull in libudev-sys (COP-47)
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            tree=$(cargo tree --target "$t" -p coppa-daemon --features serial-ptt --prefix none --format '{p}')
            if grep -q '^libudev-sys ' <<<"$tree"; then
              echo "::error::coppa-daemon with serial-ptt pulls in libudev-sys on $t; keep serialport at default-features = false in the workspace Cargo.toml"
              cargo tree --target "$t" -p coppa-daemon --features serial-ptt -i libudev-sys
              exit 1
            fi
          done
      # COP-47: tag rules, asset names, archive layout, binstall metadata and
      # the release workflow's feature list and pins.
      - name: Release tooling tests (COP-47)
        run: python3 -m unittest discover -s tools/release -v
      # COP-35: compile and run the getting-started tutorial's C FFI example,
      # as written, against the committed coppa.h, as C and as C++.
      - name: Compile the tutorial's C FFI example against coppa.h
        run: |
          cargo build -p coppa-ffi
          # build.rs regenerates coppa.h; a diff means the committed header is stale.
          git diff --exit-code -- crates/coppa-ffi/coppa.h
          dir="$RUNNER_TEMP/ffi-tutorial"
          mkdir -p "$dir"
          awk '/^## Using the C FFI/{s=1} s&&/^```c$/{p=1;next} p&&/^```$/{exit} p' docs/tutorials/getting-started.md > "$dir/hello.c"
          grep -q 'coppa_engine_destroy(&engine)' "$dir/hello.c"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Icrates/coppa-ffi "$dir/hello.c" -Ltarget/debug -lcoppa_ffi -o "$dir/hello"
          c++ -x c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Icrates/coppa-ffi "$dir/hello.c" -Ltarget/debug -lcoppa_ffi -o "$dir/hello_cpp"
          LD_LIBRARY_PATH=target/debug "$dir/hello"
          LD_LIBRARY_PATH=target/debug "$dir/hello_cpp"
      # COP-139: scenario 2 (readable FFI errors) and the C link API, as C and as C++.
      - name: C error strings and link example
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ffi-cop139"; mkdir -p "$dir"
          for src in crates/coppa-ffi/tests/c/error_strings.c crates/coppa-ffi/examples/c/link_loopback.c; do
            name=$(basename "$src" .c)
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Icrates/coppa-ffi "$src" -Ltarget/debug -lcoppa_ffi -o "$dir/$name"
            c++ -x c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Icrates/coppa-ffi "$src" -Ltarget/debug -lcoppa_ffi -o "$dir/${name}_cpp"
            LD_LIBRARY_PATH=target/debug "$dir/$name"
            LD_LIBRARY_PATH=target/debug "$dir/${name}_cpp"
          done
      # COP-139: scenario 1, two Python processes hold a link over a socketpair.
      - name: Python binding tests
        run: COPPA_LIB="$PWD/target/debug/libcoppa_ffi.so" python3 -m unittest discover -s bindings/python/tests -v
      # COP-73: run the tutorial's loopback/tx/rx shell blocks and require
      # every stdout line to appear verbatim in the doc, so the tutorial
      # cannot drift from the CLI again (this class has recurred 3 times).
      - name: Tutorial shell blocks match the CLI
        run: |
          set -euo pipefail
          cargo build -p coppa-cli
          doc=docs/tutorials/getting-started.md
          tmp="$RUNNER_TEMP/tutorial-blocks"; rm -rf "$tmp"; mkdir -p "$tmp"
          cli="$PWD/target/debug/coppa"
          run_doc() {
            local name="$1"; shift
            local out line
            # Status lines are on stderr since COP-86; capture both streams
            # so tx and rx -i are still checked, not passed vacuously.
            out=$( cd "$tmp" && "$cli" "$@" 2>&1 )
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              grep -qF -- "$line" "$doc" \
                || { echo "::error::tutorial '$name' output line missing from $doc: $line"; exit 1; }
            done <<<"$out"
            echo "'$name' block matches the CLI"
          }
          run_doc loopback loopback "Hello from Coppa"
          run_doc tx tx "CQ CQ CQ DE VK2ABC K" -o cq.wav
          run_doc rx rx -i cq.wav

  test-features:
    name: Test with Features (fast, lib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install ALSA dev headers (for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --features cpal-backend,websocket,kiss-tnc,serial-ptt,gpio-ptt,ardop,mdns --lib
      - run: cargo check --workspace --no-default-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  platform:
    name: Platform Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install ALSA dev headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace
      - name: Check the mDNS responder builds (COP-140)
        run: cargo check -p coppa-daemon --features mdns
      - run: cargo test --workspace --lib
      - name: Test cpal-backend on macOS/Windows
        if: runner.os != 'Linux'
        run: cargo test -p coppa-audio --lib --features cpal-backend
      # The feature list mirrors the coppa-daemon/* entries of RELEASE_FEATURES
      # in .github/workflows/release.yml (COP-47).
      - name: Release build of coppad with the release feature set (COP-85, Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p coppa-daemon --features cpal-backend,websocket,kiss-tnc,ardop,mdns,serial-ptt,gpio-ptt
      - name: Serial PTT unit tests (COP-85, Windows)
        if: runner.os == 'Windows'
        run: cargo test -p coppa-radio --lib --features serial-ptt
      - name: Run the real coppad (COP-85, macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo test -p coppa-daemon --features serial-ptt --test runtime_smoke
