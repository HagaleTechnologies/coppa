name: Queue Retry Handler

# Fleet CI redesign, wave 3 (coppa) -- ported from vanity's own queue-retry-handler.yml
# (HagaleTechnologies/vanity#374, hardened across 17 review rounds) and manta/widdershins/cqdx's
# own precedents. GitHub's native merge queue dequeues a PR on a merge-group CI failure, but also
# fully disarms auto-merge -- and nothing else re-arms it, since auto-merge-trigger.yml only
# fires on discrete PR-lifecycle events, none of which occur just because a merge-group check
# completed. This handler allows exactly ONE automatic retry per PR head SHA, then hands off to
# a human with a visible `needs-human` label if that retry also fails -- never an unbounded loop.
#
# `needs-human`, not a round-cap-reused label: unlike vanity/manta/cqdx/widdershins, coppa has no
# pre-existing round-25-style hard-stop mechanism in wait-for-codex.yml -- a plain label is the
# only pause signal that exists here.
#
# workflow_run, not check_run: GitHub does not fire check_run/check_suite events for a check
# suite Actions itself created (anti-recursion) -- every check in this repo is Actions-created.
on:
  workflow_run:
    # "CI" is coppa's only required PR-triggered check besides "Wait for Codex Review" (which is
    # a deliberate merge_group pass-through -- it never re-reviews a synthetic integration
    # commit, so it structurally can't fail there, matching vanity/cqdx/widdershins precedent).
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Split into three jobs so the PR number (parsed from the merge-group branch name) can reach
  # this job's own `concurrency:` expression -- GitHub only allows `github`/`inputs`/`vars`/
  # `needs`/`strategy`/`matrix` contexts there, not `steps.*`, so a single job parsing the number
  # in a step could never key its own lock on it.
  parse-pr-number:
    if: |
      github.event.workflow_run.event == 'merge_group' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pr_number: ${{ steps.parse.outputs.pr_number }}
    steps:
      - name: Parse PR number from the merge-group branch name
        id: parse
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # gh-readonly-queue/<base>/pr-<number>-<baseShaAtEnqueue> -- the trailing SHA is the
          # BASE branch's commit at enqueue time, NOT the PR's own head; deliberately not
          # captured, so nothing downstream mistakes it for the PR's revision identity.
          if [[ "$HEAD_BRANCH" =~ ^gh-readonly-queue/([^/]+)/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            pr_number="${BASH_REMATCH[2]}"
          else
            echo "::error::Could not parse merge-group branch name: $HEAD_BRANCH -- not a merge-group ref, or the naming convention changed. Exiting without action."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  # Deliberately NOT held under the shared admission-<PR#> lock: this job's own debounce gives
  # auto-merge-trigger.yml's independent runs a chance to finish acting on a freshly-pushed head
  # before this handler decides whether the fetched head is the one that actually failed.
  check-pr-state:
    needs: [parse-pr-number]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      stale: ${{ steps.pr-state.outputs.stale }}
      head_sha: ${{ steps.pr-state.outputs.head_sha }}
      head_sha12: ${{ steps.pr-state.outputs.head_sha12 }}
    steps:
      - name: Fetch the PR's real head SHA and determine whether it's safe to act
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.parse-pr-number.outputs.pr_number }}
        run: |
          pr_json=$(gh pr view "$PR" --repo "${{ github.repository }}" --json state,headRefOid,baseRefName,isDraft,autoMergeRequest,author)
          pr_state=$(echo "$pr_json" | jq -r .state)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)
          base_ref=$(echo "$pr_json" | jq -r .baseRefName)
          is_draft=$(echo "$pr_json" | jq -r .isDraft)
          auto_merge_armed=$(echo "$pr_json" | jq -r '.autoMergeRequest != null')

          # Debounce before trusting a "disarmed" reading: a "disarmed" reading here doesn't yet
          # prove the fetched head is the one that actually failed -- the synchronize run for a
          # brand-new push may simply still be queued. Re-check once after a short wait: if the
          # head changed, or auto-merge became armed meanwhile, that's proof of the race -- stand
          # down. Narrows, does not close, the window (accepted residual, same shape as
          # widdershins' own HAG-41).
          if [ "$pr_state" = "OPEN" ] && [ "$auto_merge_armed" != "true" ]; then
            sleep 10
            pr_json2=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid,autoMergeRequest)
            head_sha2=$(echo "$pr_json2" | jq -r .headRefOid)
            auto_merge_armed2=$(echo "$pr_json2" | jq -r '.autoMergeRequest != null')
            if [ "$head_sha2" != "$head_sha" ] || [ "$auto_merge_armed2" = "true" ]; then
              auto_merge_armed=true
            fi
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha12=$(echo "$head_sha" | cut -c1-12)" >> "$GITHUB_OUTPUT"

          if [ "$pr_state" != "OPEN" ]; then
            echo "::notice::PR #$PR is no longer OPEN ($pr_state) -- nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$auto_merge_armed" = "true" ]; then
            echo "::notice::PR #$PR's auto-merge is already armed (or the debounce found evidence of a race) -- this attempt is moot, standing down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$is_draft" = "true" ]; then
            echo "::notice::PR #$PR is a draft -- standing down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$base_ref" != "main" ]; then
            echo "::notice::PR #$PR's base is '$base_ref', not main -- auto-merge-trigger.yml itself would refuse this base too. Standing down."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  handle-merge-group-failure:
    needs: [parse-pr-number, check-pr-state]
    if: needs.check-pr-state.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Shared with auto-merge-trigger.yml: closes a TOCTOU race where that job could read
    # needs-human as absent and re-arm moments after this handler handed the PR off to a human.
    # Conditionally routed to a private per-run group when this attempt is already known-moot
    # (stale == 'true' upstream never reaches here at all, since the job's own `if:` above
    # excludes it -- this job only ever runs with a real lock need).
    concurrency:
      group: admission-${{ needs.parse-pr-number.outputs.pr_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.parse-pr-number.outputs.pr_number }}
      HEAD_SHA: ${{ needs.check-pr-state.outputs.head_sha }}
      HEAD_SHA12: ${{ needs.check-pr-state.outputs.head_sha12 }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Deduplicate -- has this exact merge-group attempt already been handled?
        id: dedup
        env:
          MERGE_GROUP_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ATTEMPT_LABEL="queue-attempt-handled:$(echo "$MERGE_GROUP_SHA" | cut -c1-12)"
          echo "attempt_label=$ATTEMPT_LABEL" >> "$GITHUB_OUTPUT"
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          if grep -qxF "$ATTEMPT_LABEL" <<< "$existing"; then
            echo "already_handled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_handled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this head SHA already used its one retry
        id: check-retried
        if: steps.dedup.outputs.already_handled == 'false'
        run: |
          RETRY_LABEL="queue-retry-used:${HEAD_SHA12}"
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          if grep -qxF "$RETRY_LABEL" <<< "$existing"; then
            echo "already_retried=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_retried=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry once
        id: retry
        if: steps.dedup.outputs.already_handled == 'false' && steps.check-retried.outputs.already_retried == 'false'
        env:
          LABEL: queue-retry-used:${{ needs.check-pr-state.outputs.head_sha12 }}
        run: |
          current_head_sha=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR's head moved from $HEAD_SHA12 to ${current_head_sha:0:12} since check-pr-state ran -- this attempt is moot; standing down."
            exit 0
          fi
          current_base=$(gh pr view "$PR" --repo "${{ github.repository }}" --json baseRefName --jq .baseRefName)
          if [ "$current_base" != "main" ]; then
            echo "::notice::PR #$PR's base changed to '$current_base' since check-pr-state ran -- standing down."
            exit 0
          elif gh pr merge "$PR" --repo "${{ github.repository }}" --auto --squash --match-head-commit "$HEAD_SHA"; then
            gh label create "$LABEL" --color d4c5f9 \
              --description "This revision already used its one automatic queue retry" \
              --repo "${{ github.repository }}" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=$LABEL" >/dev/null 2>&1 || true
            existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
            attached=$(grep -qxF "$LABEL" <<< "$existing_labels" && echo true || echo false)
            if [ "$attached" != "true" ]; then
              current_head_sha=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
              if [ "$current_head_sha" != "$HEAD_SHA" ]; then
                echo "::notice::PR #$PR's head moved while verifying the retry-used label -- standing down without touching auto-merge on the replacement revision."
                exit 0
              fi
              echo "::error::Retry-used label failed to attach for PR #$PR (commit $HEAD_SHA12) -- disarming auto-merge and handing off instead of risking an unbounded retry loop."
              gh pr merge "$PR" --repo "${{ github.repository }}" --disable-auto >/dev/null 2>&1 || true
              still_armed=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')
              REPO_FULL="${{ github.repository }}"; REPO_OWNER="${REPO_FULL%%/*}"; REPO_NAME_ONLY="${REPO_FULL##*/}"
              queue_state=$(gh api graphql -f query='
                query($owner: String!, $name: String!, $pr: Int!) {
                  repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
                }' -f owner="$REPO_OWNER" -f name="$REPO_NAME_ONLY" -F pr="$PR" 2>/dev/null)
              pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
              in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
              if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
                gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
                in_queue=$(gh api graphql -f query='
                  query($owner: String!, $name: String!, $pr: Int!) {
                    repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
                  }' -f owner="$REPO_OWNER" -f name="$REPO_NAME_ONLY" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
              fi
              NO_MORE_RETRIES_MARKER="<!-- queue-retry-handler:no-more-retries sha=$HEAD_SHA12 -->"
              if [ "$still_armed" = "true" ] || [ "$in_queue" = "true" ]; then
                echo "::error::Auto-merge is STILL ARMED and/or PR #$PR is still in the merge queue (armed: $still_armed, queued: $in_queue) despite the disable-auto/dequeue calls -- the one-retry bound cannot be relied on until this is fixed by hand."
                gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`), and the retry-tracking label could not be recorded. Attempted to disarm auto-merge and dequeue, but could NOT confirm it's actually clear -- this needs urgent human attention: run \`gh pr merge --disable-auto\` yourself and verify (and check whether it's still in the merge queue), or close/reopen the PR. $NO_MORE_RETRIES_MARKER" || true
                exit 1
              else
                gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`), and the retry-tracking label could not be recorded. Disarmed auto-merge rather than risk retrying unboundedly -- this needs a human: push a fix, or manually run \`gh pr merge --auto --squash\` once the labeling problem is resolved. $NO_MORE_RETRIES_MARKER" || true
              fi
              verify_marker_or_fail() {
                local marker="$1" bodies
                bodies=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
                [[ "$bodies" == *"$marker"* ]] && return 0
                echo "::error::Could not confirm the no-more-retries marker was recorded for PR #$PR -- this is load-bearing retry state, not just a notification."
                return 1
              }
              verify_marker_or_fail "$NO_MORE_RETRIES_MARKER" || exit 1
              attach_needs_human_or_fail() {
                gh label create needs-human --color d73a4a \
                  --description "Needs a human decision -- an automated handler could not safely proceed" \
                  --repo "${{ github.repository }}" >/dev/null 2>&1 || true
                local labels_before already_present
                labels_before=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
                already_present=$(grep -qxF "needs-human" <<< "$labels_before" && echo true || echo false)
                gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=needs-human" >/dev/null 2>&1 || true
                local existing_labels
                existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
                if grep -qxF "needs-human" <<< "$existing_labels"; then
                  if [ "$already_present" = "true" ]; then
                    gh pr comment "$PR" --repo "${{ github.repository }}" --body "needs-human was already attached before this fail-closed path ran (from another source) -- not claiming provenance over it; the existing pause stands as-is." >/dev/null 2>&1 || true
                  else
                    gh pr comment "$PR" --repo "${{ github.repository }}" --body "<!-- queue-retry-handler:needs-human sha=$HEAD_SHA12 -->" >/dev/null 2>&1 || true
                  fi
                  return 0
                fi
                echo "::error::Could not attach needs-human to PR #$PR -- the handoff comment posted, but the label signal did not land."
                return 1
              }
              attach_needs_human_or_fail || exit 1
            else
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed for this revision (commit \`$HEAD_SHA12\`) -- automatically re-armed auto-merge for one retry. If this fails again for the same commit, it will NOT retry again; it needs a human to look." || true
            fi
          else
            # Codex P1, this PR's own round 1: must fail the step, not just log -- this `elif`'s
            # own condition is the merge call's exit status, so reaching this branch at all means
            # NOTHING was written (no retry-used label, no handoff) -- falling through with exit
            # 0 would let "Mark this merge-group attempt as handled" mark this attempt processed
            # despite nothing having actually happened, permanently losing this head's one retry.
            # A bare failure here (not a full handoff) is correct, not just minimal: no label was
            # ever attached, so a redelivered workflow_run event naturally retries fresh via
            # check-retried's own already_retried=false read -- exactly the safe behavior for a
            # transient merge-API failure (--match-head-commit rejecting a moved head, a rate
            # limit, etc.), without prematurely spending the human-handoff path on it.
            echo "::error::Failed to re-arm auto-merge for PR #$PR (commit $HEAD_SHA12) -- --match-head-commit rejected the call (head moved) or the merge API call itself failed for another reason. Not marking this attempt handled -- a redelivered event will retry."
            exit 1
          fi

      - name: Second failure -- hand off to a human
        id: handoff
        if: steps.dedup.outputs.already_handled == 'false' && steps.check-retried.outputs.already_retried == 'true'
        run: |
          current_head_sha=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
          current_base_ref=$(gh pr view "$PR" --repo "${{ github.repository }}" --json baseRefName --jq .baseRefName)
          if [ "$current_head_sha" != "$HEAD_SHA" ] || [ "$current_base_ref" != "main" ]; then
            echo "::notice::PR #$PR's head or base changed since this job started -- this attempt is moot; standing down."
            exit 0
          fi

          labels_before=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
          already_present=$(grep -qxF "needs-human" <<< "$labels_before" && echo true || echo false)

          gh label create needs-human --color d73a4a \
            --description "Needs a human decision -- an automated handler could not safely proceed" \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=needs-human" >/dev/null 2>&1 || true
          existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
          attached=$(grep -qxF "needs-human" <<< "$existing_labels" && echo true || echo false)
          if [ "$attached" != "true" ]; then
            echo "::error::Could not attach needs-human to PR #$PR (commit $HEAD_SHA12) -- failing this step so the attempt isn't marked handled."
            exit 1
          fi

          still_armed=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')
          REPO_FULL="${{ github.repository }}"; REPO_OWNER="${REPO_FULL%%/*}"; REPO_NAME_ONLY="${REPO_FULL##*/}"
          queue_state=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
            }' -f owner="$REPO_OWNER" -f name="$REPO_NAME_ONLY" -F pr="$PR" 2>/dev/null)
          pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
          in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
          if [ "$still_armed" = "true" ] || [ "$in_queue" = "true" ]; then
            echo "::notice::Auto-merge was concurrently re-armed for PR #$PR (armed: $still_armed, queued: $in_queue) between check-pr-state's check and this handoff -- disarming/dequeuing now that the PR has been handed off."
            gh pr merge "$PR" --repo "${{ github.repository }}" --disable-auto >/dev/null 2>&1 || true
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
            still_armed_after=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')
            in_queue_after=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { isInMergeQueue } }
              }' -f owner="$REPO_OWNER" -f name="$REPO_NAME_ONLY" -F pr="$PR" 2>/dev/null | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$still_armed_after" = "true" ] || [ "$in_queue_after" = "true" ]; then
              echo "::error::Auto-merge is STILL ARMED and/or PR #$PR is still queued (armed: $still_armed_after, queued: $in_queue_after) despite the disarm/dequeue calls -- this handoff's 'no more retries' guarantee cannot be relied on until this is fixed by hand. Failing this step so the attempt isn't marked handled."
              exit 1
            fi
          fi

          if [ "$already_present" = "true" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed again for commit \`$HEAD_SHA12\` after its one automatic retry ([run]($RUN_URL)). needs-human was already attached before this handoff ran (from another source) -- not re-labeling or claiming provenance over it; the existing pause stands as-is." || true
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed again for commit \`$HEAD_SHA12\` after its one automatic retry ([run]($RUN_URL)). Not retrying again -- this needs a human decision: push a fix, or investigate and manually re-run \`gh pr merge --auto --squash\` if it's a known flake.
          <!-- queue-retry-handler:needs-human sha=$HEAD_SHA12 -->" || true
          fi

      - name: Mark this merge-group attempt as handled
        if: |
          always() &&
          needs.check-pr-state.outputs.stale == 'false' &&
          steps.dedup.outputs.already_handled == 'false' &&
          (steps.retry.conclusion == 'success' || steps.handoff.conclusion == 'success')
        env:
          ATTEMPT_LABEL: ${{ steps.dedup.outputs.attempt_label }}
        run: |
          gh label create "$ATTEMPT_LABEL" --color ededed \
            --description "This merge-group attempt has been fully processed (retried or handed off)" \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          if ! gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=$ATTEMPT_LABEL" >/dev/null 2>&1; then
            echo "::error::Could not attach $ATTEMPT_LABEL -- a redelivered event for this same attempt may be misread as unhandled and reprocessed."
            exit 1
          fi
