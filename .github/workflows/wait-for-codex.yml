name: Wait for Codex

# INTERIM VARIANT — pull_request, not pull_request_target, deliberately.
# This repo has no wait-for-codex.yml on main yet, and pull_request_target
# always reads its definition from the BASE branch — switching to it on a
# branch that's ADDING the file for the first time goes dark (neither
# trigger type fires: pull_request no longer matches this file's own `on:`,
# and pull_request_target has nothing on base to match either). Land THIS
# pull_request-triggered version first so main has a working baseline, then
# a fast follow-up PR switches to pull_request_target for the real security
# reason documented in that PR (a same-repo PR modifying the merged file
# could otherwise exfiltrate CODEX_REVIEW_PAT or self-resolve its own
# review threads before human review — see HagaleTechnologies/harbor#59/#60).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  wait-for-codex:
    name: Wait for Codex Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Request re-review on a re-push
        if: github.event.action == 'synchronize'
        env:
          # Codex only auto-reviews on opened/ready_for_review, not on every
          # push (this repo's own AGENTS.md: "not every push. After a
          # remediation push, request a re-review with `@codex review`" — and
          # that trigger requires an authenticated human comment; a
          # github-actions[bot]-authored comment gets "create a Codex account
          # and connect to github" instead of a review, confirmed live on
          # HagaleTechnologies/harbor#56). CODEX_REVIEW_PAT is a fine-grained
          # PAT under an account Codex already recognizes, stored as an org
          # secret, used ONLY to post this one comment.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          # Single reference point for "before this round" used by both this
          # step and the poll step — written to a file so both steps agree on
          # it exactly, closing a real gap Codex found: recomputing "now" a
          # second time in the poll step let an OLD, already-existing review
          # on this same HEAD_SHA (from some earlier, unrelated run) satisfy
          # "reviewed_head" without a genuinely fresh look ever happening.
          RUN_STARTED=$(date -u -d '15 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "$RUN_STARTED" > /tmp/codex-run-started.txt

          # Snapshot unresolved Codex-*started* review threads BEFORE asking
          # for a fresh look. Only a thread with EVERY comment authored by
          # Codex is eligible for later auto-resolution — a thread any human
          # has ever replied in is excluded permanently, not just for this
          # round, so a clean Codex re-review can never silently override a
          # human's still-open concern (flagged reviewing this file, on
          # harbor#60; comments(first: 50) instead of first: 1 for this).
          #
          # KNOWN LIMITATION, accepted not fixed: reviewThreads(first: 100)
          # doesn't paginate past 100 threads, and comments(first: 50) doesn't
          # paginate past 50 replies in one thread (both flagged on harbor#59
          # /#60). Neither is realistic on these repos; revisit if that ever
          # stops being true.
          gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector"))
              | .id]' \
            > /tmp/codex-baseline-threads.json

          # Capture the comment's own id: a clean re-review can land as a 👍
          # reaction on THIS comment specifically, not on the PR/issue itself
          # (issue-level and comment-level reactions are separate REST
          # endpoints — flagged reviewing this file, on harbor#59).
          gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review" --jq '.id' \
            > /tmp/codex-review-comment-id.json

      - name: Poll for a terminal Codex signal on this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_SYNC: ${{ github.event.action == 'synchronize' }}
        run: |
          # Only count signals created at/after this run started, and reviews
          # submitted against the CURRENT head commit AND after this round
          # started (a small buffer absorbs clock skew between this runner
          # and Codex; the timestamp bound on reviews specifically closes the
          # stale-review gap noted in the step above).
          #
          # NOTE: `gh api --jq` is gh's OWN limited jq subset and does NOT
          # accept `--arg` the way real `jq` does (`gh api ... --jq --arg x y
          # '...'` silently mis-parses as 4 positional args and errors
          # "accepts 1 arg(s), received 4", killing the job on its first loop
          # iteration under `bash -e`). Pipe raw JSON into real `jq` instead
          # — this bit this exact workflow once already.
          #
          # NOTE: `gh api --paginate` emits ONE JSON DOCUMENT PER PAGE, not one
          # combined array — `--slurp` wraps all pages into a single top-level
          # array (of per-page arrays), so flatten with `.[] | .[]` before
          # counting. Without this, a busy PR (>1 page of comments/reviews/
          # reactions) prints one length per page and the numeric `-gt` test
          # breaks (also flagged reviewing this file, on harbor#59).
          RUN_STARTED=$(cat /tmp/codex-run-started.txt 2>/dev/null || date -u -d '15 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$((SECONDS+1680))
          responded=""
          reviewed_head=""
          COMMENT_ID=$(cat /tmp/codex-review-comment-id.json 2>/dev/null || echo "")
          while [ $SECONDS -lt $END ]; do
            comments=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" | jq --arg since "$RUN_STARTED" '[.[] | .[] | select(.user.login=="chatgpt-codex-connector[bot]" and .created_at >= $since)] | length')
            reviews=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews" | jq --arg sha "$HEAD_SHA" --arg since "$RUN_STARTED" '[.[] | .[] | select(.user.login=="chatgpt-codex-connector[bot]" and .commit_id == $sha and .submitted_at >= $since)] | length')
            thumbsup=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/reactions" | jq --arg since "$RUN_STARTED" '[.[] | .[] | select(.user.login=="chatgpt-codex-connector[bot]" and .content=="+1" and .created_at >= $since)] | length')
            comment_thumbsup=0
            if [ -n "$COMMENT_ID" ]; then
              comment_thumbsup=$(gh api --paginate --slurp "repos/$REPO/issues/comments/$COMMENT_ID/reactions" | jq '[.[] | .[] | select(.user.login=="chatgpt-codex-connector[bot]" and .content=="+1")] | length')
            fi
            if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ]; then
              # A 👍 on the @codex-review comment itself is just as tightly
              # scoped to "responded to THIS request" as a formal review tied
              # to HEAD_SHA — Codex's clean-pass signal is often only this
              # reaction, never a formal review object (flagged reviewing
              # this file, on harbor#59).
              reviewed_head=1
            fi
            if [ "$comments" -gt 0 ] || [ "$reviews" -gt 0 ] || [ "$thumbsup" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ]; then
              echo "Codex responded on this revision: comments=$comments reviews=$reviews thumbsup=$thumbsup comment_thumbsup=$comment_thumbsup"
              responded=1
              break
            fi
            echo "Still waiting for Codex to respond to $HEAD_SHA..."
            sleep 20
          done
          if [ -z "$responded" ]; then
            echo "::error::Codex did not respond to $HEAD_SHA within 28 minutes"
            exit 1
          fi

          if [ "$IS_SYNC" != "true" ]; then
            exit 0
          fi

          # Auto-resolve stale threads ONLY on a genuine head-tied review (not
          # just any comment/reaction, which could be an unrelated status
          # message rather than Codex actually finishing a look at this
          # revision — flagged reviewing this file, on harbor#59).
          if [ -z "$reviewed_head" ]; then
            echo "Codex responded, but not with a review tied to $HEAD_SHA specifically — not auto-resolving anything."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline=$(cat /tmp/codex-baseline-threads.json 2>/dev/null || echo '[]')

          # Re-fetch full thread state and compute, in one pass:
          #   new_count  — unresolved threads NOT in baseline (Codex raised
          #                something brand new this round)
          #   resolvable — baseline threads that are STILL pure-Codex (no
          #                human ever replied, checked again now — a human
          #                could have joined since the snapshot) AND received
          #                no fresh Codex comment after RUN_STARTED (Codex
          #                restating a concern IN an existing thread, rather
          #                than opening a new one, must not count as "clean" —
          #                both gaps flagged reviewing this file, on
          #                harbor#60).
          result=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            --jq --argjson baseline "$baseline" --arg since "$RUN_STARTED" '
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes | map(select(.isResolved == false) | .id)) as $all_unresolved
              | {
                  new_count: (($all_unresolved - $baseline) | length),
                  resolvable: [
                    $nodes[]
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector"))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | .id
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          if [ "$new_count" -gt 0 ]; then
            echo "Codex raised $new_count new concern(s) on this revision — leaving all threads as-is for human review."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[]' | while read -r thread_id; do
            [ -z "$thread_id" ] && continue
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id — leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            # GitHub can reject resolveReviewThread on a bot-started thread
            # under the Actions token even with pull-requests: write, with
            # "Resource not accessible by integration" (flagged reviewing
            # this file, on harbor#60) — soft-skip rather than crash the
            # whole required check over a thread that's still genuinely
            # addressed, just not mechanically resolvable here.
            if ! gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done
