name: Wait for Codex Review

# pull_request_target, not pull_request, deliberately. A same-repo PR that
# edits THIS file could, under pull_request, run its OWN modified copy with
# CODEX_REVIEW_PAT still in scope -- able to exfiltrate the PAT or
# self-resolve its own Codex review threads before a human ever looks.
# pull_request_target always reads its workflow definition from the BASE
# branch, never the PR's own copy, closing that hole. This file is now a
# thin stub calling credenza's wait-for-codex-review.yml, which is safe
# under pull_request_target for the same reason documented on its own
# header: it never runs actions/checkout or executes anything from the PR's
# own tree -- every step only talks to the GitHub API (gh api / gh api
# graphql) against event metadata (PR number, head SHA, review threads).
#
# merge_group is currently DORMANT on coppa: the repo's ruleset has no
# merge_queue rule, and ci.yml itself has no merge_group: trigger, so the
# required "CI" check can never resolve for a merge-group SHA today. Kept
# for parity with coppa's pre-migration behavior (its own old file already
# had this same merge_group wiring) and as a cheap guard against a future
# native-merge-queue switch -- if coppa ever adopts GitHub's native merge
# queue, the merge-group SHA already passed a real Codex review during its
# own PR phase, so this job passes it through rather than re-reviewing a
# synthetic integration commit (no PR exists to comment on or resolve
# threads against).
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  # write, not read: creating the codex-clean label below needs
  # Issues:write on GitHub's Create-a-label endpoint -- read is
  # insufficient and the label-add calls are written fail-open (`|| true`),
  # so this would otherwise fail completely silently rather than loudly.
  issues: write

jobs:
  wait-for-codex-call:
    # Skipped entirely on merge_group -- credenza's reusable workflow only
    # understands pull_request_target. The fan-in job below handles the
    # merge_group pass-through directly, without invoking this call.
    if: github.event_name == 'pull_request_target'
    # A reusable workflow's own concurrency: block does not compose safely
    # with a caller's own group (confirmed live on panino PR #120) -- every
    # caller sets its own job-level concurrency instead. Preserves coppa's
    # exact pre-migration group key.
    concurrency:
      group: wait-for-codex-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    # Union of what credenza's two internal jobs (wait-for-codex-queue-watchdog:
    # {actions: write}; wait-for-codex: {contents: read, pull-requests: write,
    # issues: write}) each request -- a called reusable workflow's job
    # permissions are capped by this caller job's own ceiling.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: HagaleTechnologies/credenza/.github/workflows/wait-for-codex-review.yml@3ee4adf4944a5c5645a3c5ce248fd4e77a6f10da
    with:
      runner_label: '["self-hosted","linux","rigel-light"]'
      exclude_dependabot: true
    secrets:
      codex_review_pat: ${{ secrets.CODEX_REVIEW_PAT }}

  # Native (non-uses:) job carrying the literal required-check name. A
  # uses: job's own reported check-run name is not reliably stable
  # (confirmed live on panino PR #120/#121: identical file content reported
  # both a bare and a caller-prefixed name across different PRs). A native
  # job's name: is authoritative. This job also absorbs coppa's merge_group
  # pass-through, so no second job needs to share this check name.
  wait-for-codex:
    name: Wait for Codex Review
    needs: [wait-for-codex-call]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report result
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "merge_group event: pass-through (the merge-group SHA already passed a real Codex review during its PR phase)."
            exit 0
          fi
          # A skip here means "draft PR or dependabot[bot] -- not
          # applicable for this revision," the exact same case coppa's own
          # pre-migration single-job file handled with an in-step `if:`
          # no-op that reported success, never a job-level skip. This
          # tolerance MUST land now, not as a same-day emergency follow-up
          # (see cqdx#400 / reference_codex_clean_gate_skip_vs_success_semantics.md).
          if [ "${{ needs.wait-for-codex-call.result }}" = "skipped" ]; then
            echo "wait-for-codex-call skipped (draft PR or dependabot[bot] -- not applicable for this revision)."
            exit 0
          fi
          if [ "${{ needs.wait-for-codex-call.result }}" != "success" ]; then
            echo "::error::wait-for-codex-call did not succeed (result: ${{ needs.wait-for-codex-call.result }})"
            exit 1
          fi
          echo "wait-for-codex-call succeeded."
