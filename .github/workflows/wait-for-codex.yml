name: Wait for Codex

# pull_request_target (not pull_request): this workflow handles a
# Codex-recognized PAT and a write-scoped GITHUB_TOKEN. On `pull_request`, a
# same-repo PR that edits THIS FILE runs its own edited version with full
# secret/write access before any human reviews it — letting PR-controlled
# code exfiltrate CODEX_REVIEW_PAT or self-resolve its own review threads,
# bypassing the exact gate this rollout exists to enforce (flagged by Codex
# reviewing this exact file, both on HagaleTechnologies/harbor#59 and again
# on this repo's own interim pull_request-triggered PR). pull_request_target
# always runs the workflow definition from the BASE branch, so a PR
# modifying this file has zero effect on what runs for it until the change
# is actually merged. Safe here because this workflow never checks out or
# executes the PR's own code — only `gh api` calls against metadata (PR
# number, head SHA) from the event payload. This follows the interim
# pull_request-triggered version that established a working baseline on
# main (pull_request_target can't be the FIRST version of this file — it
# reads its trigger definition from the base branch, which had nothing to
# match until that interim version merged).
on:
  # `reopened` dropped: Codex's own docs describe automatic review as firing
  # when a PR is newly opened for review, with re-requests done explicitly
  # via `@codex review` — a reopen gets neither, so gating merge on it meant
  # 70 minutes of passive polling for a signal that was never coming (Codex
  # P2, flagged reviewing this file).
  pull_request_target:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

# A newer push must supersede an older run outright rather than let the old
# run finish and mutate review threads based on a review of a commit that's
# no longer HEAD — cancelling is simpler and stronger than re-verifying HEAD
# right before the mutation (Codex P2, this file's own auto-merge rollout).
concurrency:
  group: wait-for-codex-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-codex:
    name: Wait for Codex Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Record run start
        env:
          # Seed from the PR event's OWN updated_at (set by GitHub at dispatch
          # time), not a runner-observed "now". A queued or slow-starting
          # runner previously computed its cutoff only after the runner was
          # already up, so a Codex response that landed in the gap between
          # the real event and the runner actually starting was silently
          # older than the cutoff and got ignored as "before this round"
          # (Codex P2, flagged reviewing this file). Doing this as its own
          # unconditional first step means every trigger type (not just
          # synchronize) gets the same immune-to-runner-startup timestamp.
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          RUN_STARTED=$(date -u -d "$PR_UPDATED_AT - 15 seconds" +%Y-%m-%dT%H:%M:%SZ)
          echo "$RUN_STARTED" > /tmp/codex-run-started.txt

      - name: Request re-review on a re-push
        if: github.event.action == 'synchronize'
        env:
          # Codex only auto-reviews on opened/ready_for_review, not on every
          # push (this repo's own AGENTS.md: "not every push. After a
          # remediation push, request a re-review with `@codex review`" — and
          # that trigger requires an authenticated human comment; a
          # github-actions[bot]-authored comment gets "create a Codex account
          # and connect to github" instead of a review, confirmed live on
          # HagaleTechnologies/harbor#56). CODEX_REVIEW_PAT is a fine-grained
          # PAT under an account Codex already recognizes, stored as an org
          # secret, used ONLY to post this one comment.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          # Read-only, always fully scoped (unlike a fine-grained PAT, which
          # this step's own docs say is provisioned ONLY for posting the
          # comment below) — used for the baseline review-threads read so a
          # minimally-scoped PAT lacking PR-read can't crash this step before
          # the request is even posted (Codex P2, flagged reviewing this
          # file).
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Under pull_request_target, secrets ARE available even for fork
          # PRs (that's the whole point of this trigger type) — so this
          # guard is now purely a defensive catch-all for CODEX_REVIEW_PAT
          # being genuinely unset/misconfigured, not a fork-specific
          # concern (it WAS fork-specific on this repo's earlier interim
          # pull_request-triggered version, where GitHub withholds secrets
          # from fork-originated runs by design). Kept rather than removed:
          # a missing secret should degrade to skipping the re-review
          # request, not crash this step under `bash -e`.
          #
          # DELIBERATELY NOT auto-discovering a maintainer's manual `@codex
          # review` comment here: an earlier version of this fix tried that
          # (a REST lookup + node_id capture) and Codex's review of THAT fix
          # found three more real gaps in it — unpaginated (misses anything
          # past GitHub's default 30-comment page), one-shot (a comment added
          # during the 70-minute wait is never seen), and its knock-on effect
          # on the error-comment check below. Chasing that kept spawning new
          # edge cases in a path this repo is unlikely to ever exercise (a
          # private repo with a single admin taking no outside fork PRs
          # today). Accepted, deliberate scope limit instead: on a fork
          # re-push, the poll step still catches a formal review tied to
          # HEAD_SHA with zero extra code (that path never needed a captured
          # comment id). The one case this doesn't cover — Codex's clean-pass
          # landing ONLY as a reaction on a maintainer's own manually-posted
          # comment, never a formal review — degrades to the 70-minute
          # timeout, at which point the repo's admin-only bypass (configured
          # on every HagaleTechnologies ruleset) is the intended way through,
          # not more automation for a rare path.
          if [ -z "$GH_TOKEN" ]; then
            echo "CODEX_REVIEW_PAT not set — skipping the fresh re-review request. A formal Codex review tied to this head still resolves the check normally; a maintainer can otherwise use the repo's admin bypass."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          # Snapshot unresolved Codex-*started* review threads BEFORE asking
          # for a fresh look. Only a thread with EVERY comment authored by
          # Codex (or this workflow's own prior auto-resolve reply, which
          # carries no new human concern) is eligible for later
          # auto-resolution — a thread any human has ever replied in is
          # excluded permanently, not just for this round, so a clean Codex
          # re-review can never silently override a human's still-open
          # concern (flagged reviewing this file, on harbor#60; comments
          # (first: 50) instead of first: 1 for this). Treating this
          # workflow's own reply as ignorable closes a separate gap: if a
          # prior round's reply succeeded but resolveReviewThread then failed
          # (permissions/transient), that thread must stay eligible for retry
          # on the next clean re-review rather than becoming permanently
          # manual just because it now contains a non-Codex comment (Codex
          # P3, this file's own auto-merge rollout).
          #
          # KNOWN LIMITATION, accepted not fixed: reviewThreads(first: 100)
          # doesn't paginate past 100 threads, and comments(first: 50) doesn't
          # paginate past 50 replies in one thread (both flagged on harbor#59
          # /#60). Neither is realistic on these repos; revisit if that ever
          # stops being true.
          #
          # NOTE on the author check below: "github-actions" (no `[bot]`
          # suffix) is deliberate, not a REST-vs-GraphQL mixup — verified
          # empirically against this exact rollout's own data (2026-08-05):
          # GraphQL's `author.login` never carries the `[bot]` suffix REST
          # uses (`dependabot`, not `dependabot[bot]`, appears in this same
          # repo's own review-thread comments), matching `chatgpt-codex-
          # connector` elsewhere in this file. A later Codex pass suggested
          # adding the `[bot]`-suffixed form here on the theory that it's
          # what a GITHUB_TOKEN-authored reply's login looks like — that
          # variant does not occur in GraphQL responses, so it was not added.
          baseline_query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }'
          baseline_response=$(GH_TOKEN="$READ_TOKEN" gh api graphql -f query="$baseline_query" -f owner="$OWNER" -f name="$NAME" -F pr="$PR")
          echo "$baseline_response" \
            | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions"))
              | .id]' \
            > /tmp/codex-baseline-threads.json

          # Second, BROADER baseline for deciding what's "new" this round
          # (as opposed to /tmp/codex-baseline-threads.json above, which
          # stays purity-filtered and is only for deciding what's safe to
          # auto-resolve): a thread Codex started before this round, that
          # since got a human reply, still isn't a NEW concern — but the
          # poll step's new_count check now identifies Codex-started threads
          # by their FIRST comment only (see that step's comments for why),
          # so without this second snapshot such a thread would look "new"
          # forever (never in the strict pure-only baseline, since the human
          # reply excludes it there), permanently blocking every future
          # round's auto-resolution (Codex P2, flagged reviewing this file —
          # a direct follow-up to the codex_initiated fix in the poll step).
          echo "$baseline_response" \
            | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              | .id]' \
            > /tmp/codex-baseline-initiated.json

          # Capture the comment's own GraphQL node_id (not its REST numeric
          # id — the poll step's combined query looks it up via GraphQL's
          # `node(id:)`, which needs the node_id): a clean re-review can land
          # as a 👍 reaction on THIS comment specifically, not on the PR/
          # issue itself (issue-level and comment-level reactions are
          # separate endpoints — flagged reviewing this file, on harbor#59).
          gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review" --jq '.node_id' \
            > /tmp/codex-review-comment-id.json

      - name: Poll for a terminal Codex signal on this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the reply+resolve mutations at the end of this step —
          # GITHUB_TOKEN (the github-actions[bot] identity) reliably fails
          # resolveReviewThread on Codex-started threads with "Resource not
          # accessible by integration" (confirmed live on pancetta#239: 10/10
          # resolve attempts failed this way, replies posted fine). A PAT
          # under a real user account with actual write access resolves the
          # same threads without issue — proven directly this session
          # resolving all 22 threads on coppa#77 by hand under this exact
          # identity. Reusing CODEX_REVIEW_PAT rather than provisioning a
          # second secret, since it's already a real-user PAT with repo
          # write access, just used for a second purpose now.
          RESOLVE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_SYNC: ${{ github.event.action == 'synchronize' }}
        run: |
          set -o pipefail
          # Only count signals created at/after this run started, and reviews
          # submitted against the CURRENT head commit AND after this round
          # started (a small buffer absorbs clock skew between this runner
          # and Codex; the timestamp bound on reviews specifically closes the
          # stale-review gap noted in the step above).
          #
          # A single combined GraphQL query per poll, not 3-4 separate REST
          # calls: `GITHUB_TOKEN` is capped at 1,000 requests/hour/repository
          # (shared across every concurrent workflow run in the repo, not
          # just this one), and the previous 4-calls-per-20s loop could drive
          # 1,000+ req/hr on its own with just two concurrent PRs under
          # review — enough to make this required check fail on a rate limit
          # rather than a real Codex signal (Codex P2, flagged reviewing this
          # file, this rollout's own auto-merge PR).
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          RUN_STARTED=$(cat /tmp/codex-run-started.txt 2>/dev/null || date -u -d '15 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          # Bumped from 18min -> 28min -> 70min over this rollout: burst load
          # (many PRs/pushes landing across the org at once) has pushed
          # Codex's real response time past 45-50 minutes on at least one
          # occasion. This margin is deliberately generous, not arbitrary.
          END=$((SECONDS+4200))
          responded=""
          reviewed_head=""
          COMMENT_ID=$(cat /tmp/codex-review-comment-id.json 2>/dev/null || echo "")
          HAS_COMMENT="false"
          [ -n "$COMMENT_ID" ] && HAS_COMMENT="true"
          while [ $SECONDS -lt $END ]; do
            poll=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!, $hasComment: Boolean!, $commentId: ID!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    comments(last: 50) { nodes { author { login } body createdAt } }
                    reviews(last: 50) { nodes { author { login } commit { oid } submittedAt } }
                    reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                  }
                }
                commentNode: node(id: $commentId) @include(if: $hasComment) {
                  ... on IssueComment {
                    reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -F hasComment="$HAS_COMMENT" -f commentId="${COMMENT_ID:-placeholder}" \
              | jq --arg since "$RUN_STARTED" --arg sha "$HEAD_SHA" '
                def is_error_shaped: test("(quota|rate.?limit|unable to (access|start|review)|cannot access|authentication (failed|error)|workspace error|failed to (access|clone|start)|create a codex account and connect)"; "i");
                # Codex'"'"'s clean-pass response on a re-push can ALSO land as a
                # plain issue comment (not a formal review, not a reaction) whose
                # body embeds "**Reviewed commit:** `<10-hex-char prefix>`" — a
                # real, empirically observed shape (confirmed live on this
                # rollout: HagaleTechnologies/pancetta#239, Codex replied
                # "Didn'"'"'t find any major issues... Reviewed commit: `7ed84e468d`"
                # matching that PR'"'"'s actual head SHA, and the required check
                # still spun for 44+ minutes because neither `reviews` nor
                # `comment_thumbsup` ever fires for this shape). This IS a
                # genuinely head-tied signal, just carried in the comment text
                # instead of a separate GraphQL field.
                def reviewed_commit_prefix: try (.body | capture("[Rr]eviewed commit:?\\**\\s*`(?<c>[0-9a-f]{7,40})`").c) catch null;
                .data.repository.pullRequest as $p
                | ([$p.comments.nodes[] | select(.author.login=="chatgpt-codex-connector" and .createdAt >= $since)]) as $fresh_comments
                | {
                    comments: ([$fresh_comments[] | select(.body | is_error_shaped | not)] | length),
                    comment_head_tied: ([$fresh_comments[]
                      | select(.body | is_error_shaped | not)
                      | select((reviewed_commit_prefix // "") as $c | $c != "" and ($sha | startswith($c)))
                    ] | length),
                    error_comments: ([$fresh_comments[] | select(.body | is_error_shaped)] | length),
                    reviews: ([$p.reviews.nodes[] | select(.author.login=="chatgpt-codex-connector" and .commit.oid==$sha and .submittedAt >= $since)] | length),
                    thumbsup: ([$p.reactions.nodes[] | select(.user.login=="chatgpt-codex-connector" and .createdAt >= $since)] | length),
                    comment_thumbsup: ([(.commentNode.reactions.nodes // [])[] | select(.user.login=="chatgpt-codex-connector" and .createdAt >= $since)] | length)
                  }')
            comments=$(echo "$poll" | jq '.comments')
            comment_head_tied=$(echo "$poll" | jq '.comment_head_tied')
            error_comments=$(echo "$poll" | jq '.error_comments')
            reviews=$(echo "$poll" | jq '.reviews')
            thumbsup=$(echo "$poll" | jq '.thumbsup')
            comment_thumbsup=$(echo "$poll" | jq '.comment_thumbsup')
            if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
              # A 👍 on the @codex-review comment itself, or a plain comment
              # whose own text names THIS head's commit, are just as tightly
              # scoped to "responded to THIS request" as a formal review tied
              # to HEAD_SHA — Codex's clean-pass signal is often only one of
              # these, never a formal review object (flagged reviewing this
              # file, on harbor#59; the comment-text shape found live on
              # pancetta#239, see above).
              reviewed_head=1
            fi
            if [ "$IS_SYNC" = "true" ]; then
              # On a re-push specifically, a bare new issue comment or a
              # generic issue-level thumbsup is NOT proof Codex looked at
              # THIS head — either could be a stale signal from an unrelated
              # earlier review landing after RUN_STARTED but before the fresh
              # `@codex review` request was actually processed, which let
              # this required check pass without any head-tied Codex signal
              # ever arriving (Codex P1, flagged reviewing this file). Only
              # accept signals that are provably tied to this specific
              # request: a review against HEAD_SHA, a reaction on the comment
              # that requested it, or a comment whose own text names this
              # HEAD_SHA. `error_comments` is deliberately NOT checked on this
              # branch — it exists only to keep a bare error comment from
              # satisfying the non-sync "any comment counts" condition below,
              # and an unscoped error from some earlier, unrelated request
              # must not fail the CURRENT push's own still-pending signal
              # (Codex P2, flagged reviewing this file).
              if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
                echo "Codex responded on this revision: reviews=$reviews comment_thumbsup=$comment_thumbsup comment_head_tied=$comment_head_tied"
                responded=1
                break
              fi
            else
              # Check for a genuine success FIRST, error fail-fast second: a
              # manually re-run job reuses the original event's cutoff, so an
              # older transient Codex error and a later real success can both
              # be in-window on the same poll. Only fail fast on the error
              # when there's no success signal alongside it — otherwise a
              # rerun (which this exact error message tells maintainers to
              # do) could stay permanently poisoned by the first attempt's
              # failure even after Codex succeeds on the second (Codex P2,
              # flagged reviewing this file).
              if [ "$comments" -gt 0 ] || [ "$reviews" -gt 0 ] || [ "$thumbsup" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ]; then
                echo "Codex responded on this revision: comments=$comments reviews=$reviews thumbsup=$thumbsup comment_thumbsup=$comment_thumbsup"
                responded=1
                break
              fi
              if [ "$error_comments" -gt 0 ]; then
                # Codex replies with an issue comment for its own failures too
                # (auth/workspace/quota/account-connection errors), which
                # would otherwise satisfy the "any comment counts" condition
                # above and turn this required check green with no actual
                # review ever happening (Codex P2, flagged reviewing this
                # file). Only reachable here (never on a re-push, see above)
                # since this is the one branch that treats a bare comment as
                # a success signal at all. Fail loudly and immediately rather
                # than either accepting it as success OR silently waiting out
                # the remaining timeout for a different signal — Tony's own
                # directive: don't waste wall-clock time on a wait that a
                # Codex-reported error already tells us won't resolve itself.
                #
                # KNOWN LIMITATION, accepted not fixed: a fresh, genuinely
                # unrelated Codex issue comment (e.g. someone asks
                # `@codex fix CI` while this gate is waiting) would also
                # satisfy the "any comment counts" condition above and pass
                # as if it were a real review — this branch only guards
                # against Codex's own documented error phrases, not against
                # positively confirming a comment IS a completed review.
                # Building a reliable positive classifier for "this comment
                # proves a real review happened" is real ongoing work for
                # marginal benefit on a low-traffic gate; revisit if an
                # unrelated-comment false-pass is ever actually observed
                # (flagged reviewing this file).
                echo "::error::Codex reported an error (quota/auth/workspace/account-connection) instead of reviewing $HEAD_SHA — failing now rather than waiting out the remaining timeout. Re-run this check once the underlying Codex issue is resolved."
                exit 1
              fi
            fi
            echo "Still waiting for Codex to respond to $HEAD_SHA..."
            sleep 20
          done
          if [ -z "$responded" ]; then
            echo "::error::Codex did not respond to $HEAD_SHA within 70 minutes"
            exit 1
          fi

          if [ "$IS_SYNC" != "true" ]; then
            # This branch previously exited 0 the moment ANY Codex signal was
            # seen, without checking whether that signal actually left
            # unresolved concerns open — so Codex's own initial automatic
            # review finding real P1s could still turn this check green
            # (Codex P2, flagged reviewing this file). Not a live merge-
            # safety hole on this fleet specifically (every HagaleTechnologies
            # ruleset also sets required_review_thread_resolution, which
            # independently blocks merge regardless of this check's status —
            # confirmed empirically on coppa#77), but this check's own name
            # and green/red status should mean what it says rather than
            # relying on a separate, easily-forgotten ruleset setting to
            # catch the gap. Query and fail on any unresolved Codex-STARTED
            # thread before declaring success — tested by the thread's FIRST
            # comment (codex_initiated), not "every comment is Codex", so a
            # maintainer replying to a brand-new Codex finding before this
            # query runs can't hide it (the same gap the synchronize path's
            # new_count check had, flagged reviewing this file as a direct
            # follow-up — the initial-review path had it too and hadn't been
            # updated yet).
            OWNER="${REPO%%/*}"
            NAME="${REPO##*/}"
            unresolved=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes { isResolved comments(first: 50) { nodes { author { login } } } }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
              | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false)
                | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              ] | length')
            if [ "$unresolved" -gt 0 ]; then
              echo "::error::Codex's initial review left $unresolved unresolved concern(s) open — resolve them, then push a remediation commit to trigger a fresh re-review."
              exit 1
            fi
            exit 0
          fi

          # Auto-resolve stale threads ONLY on a genuine head-tied review (not
          # just any comment/reaction, which could be an unrelated status
          # message rather than Codex actually finishing a look at this
          # revision — flagged reviewing this file, on harbor#59).
          if [ -z "$reviewed_head" ]; then
            echo "Codex responded, but not with a review tied to $HEAD_SHA specifically — not auto-resolving anything."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline=$(cat /tmp/codex-baseline-threads.json 2>/dev/null || echo '[]')
          baseline_initiated=$(cat /tmp/codex-baseline-initiated.json 2>/dev/null || echo '[]')

          # Re-fetch full thread state and compute, in one pass:
          #   new_count  — unresolved, PURE-CODEX threads NOT in baseline
          #                (Codex raised something brand new this round).
          #                Deliberately scoped to Codex-authored threads only
          #                — an unrelated pre-existing human thread (or a
          #                Codex thread a human already joined) must not
          #                block auto-resolving OTHER, still-clean baseline
          #                threads just by being unresolved (Codex P3,
          #                flagged reviewing this file).
          #   resolvable — baseline threads that are STILL unresolved (a
          #                maintainer may have resolved one by hand while
          #                this job was waiting — checked again now, not
          #                assumed from the snapshot) AND STILL pure-Codex/
          #                workflow-reply-only (no other human joined since
          #                the snapshot) AND received no fresh Codex comment
          #                after RUN_STARTED (Codex restating a concern IN an
          #                existing thread, rather than opening a new one,
          #                must not count as "clean" — all three gaps
          #                flagged reviewing this file, on harbor#60 and this
          #                file's own auto-merge rollout).
          result=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            | jq --argjson baseline "$baseline" --argjson baselineInitiated "$baseline_initiated" --arg since "$RUN_STARTED" '
              def ignorable_author: . == "chatgpt-codex-connector" or . == "github-actions";
              # "New concern" and "safe to auto-resolve" need DIFFERENT
              # authorship tests, not the same purity filter (Codex P2,
              # flagged reviewing this file): if Codex opens a genuinely new
              # thread this round and a maintainer replies to it before this
              # query runs, the OLD single "all comments ignorable" test
              # dropped that thread from new_count entirely, silently letting
              # the round auto-resolve every OTHER baseline thread despite an
              # unaddressed live concern. codex_initiated (did CODEX START
              # this thread, regardless of who replied since) is the right
              # test for "is this a concern Codex raised" — used for
              # new_count, compared against $baselineInitiated (the SAME
              # codex_initiated test snapshotted before this round — NOT
              # $baseline, which is purity-filtered: an old Codex-started
              # thread that already had a human reply BEFORE this round would
              # never be in the strict $baseline, so diffing against it would
              # make that old thread look "new" forever, permanently blocking
              # every future round's auto-resolution — a direct follow-up gap
              # flagged reviewing this file). ignorable_author on EVERY
              # comment (unchanged, stricter) stays the test for "is this
              # safe to silently auto-resolve", diffed against the strict
              # $baseline as before — a human joining a thread, new or old,
              # should always take it out of auto-resolution, whether or not
              # it also counts as a blocking new concern.
              def codex_initiated: (.comments.nodes[0].author.login == "chatgpt-codex-connector");
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes
                  | map(select(.isResolved == false)
                        | select(codex_initiated)
                        | .id)) as $codex_unresolved
              | {
                  new_count: (($codex_unresolved - $baselineInitiated) | length),
                  resolvable: [
                    $nodes[]
                    | select(.isResolved == false)
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(ignorable_author))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | .id
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          if [ "$new_count" -gt 0 ]; then
            echo "Codex raised $new_count new concern(s) on this revision — leaving all threads as-is for human review."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[]' | while read -r thread_id; do
            [ -z "$thread_id" ] && continue
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id — leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            # GITHUB_TOKEN (github-actions[bot]) reliably fails this specific
            # mutation on a bot-started thread with "Resource not accessible
            # by integration" — confirmed live on pancetta#239, 10/10 resolve
            # attempts failed this way even though the reply above succeeded
            # every time. RESOLVE_TOKEN (a real-user PAT) does not have this
            # restriction. Kept as a soft-skip on failure rather than crashing
            # the whole required check, in case RESOLVE_TOKEN itself is ever
            # unset/revoked — the reply above stays authored as
            # "github-actions" regardless of which token resolves it, which
            # the ignorable-author filters above already treat as
            # non-blocking, so a thread that still fails here stays eligible
            # for a clean resolve on the next round instead of becoming
            # permanently manual (Codex P3).
            if ! GH_TOKEN="$RESOLVE_TOKEN" gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done
