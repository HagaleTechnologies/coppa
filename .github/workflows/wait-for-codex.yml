name: Wait for Codex Review

# HAG-78: replaces the old single-job polling design (a job that posted "@codex review" then
# polled for up to 75 minutes for a terminal signal) with the event-driven request/response
# pair credenza already runs for HagaleTechnologies' private repos (codex-review-request.yml/
# codex-review-response.yml). coppa is PUBLIC and credenza is PRIVATE -- GitHub does not allow a
# public repo to `uses:` a private repo's reusable workflow, so this file hand-ports that
# logic inline instead of calling it. Ported verbatim where possible; where coppa's own OLD
# polling implementation had independently discovered and fixed a real bug credenza's shared
# template still lacks (`error_head_tied` -- see the response job's verdict step), that fix is
# carried forward here too, not dropped.
#
# Two jobs instead of one: `codex-review-request` (fires once per PR action, posts the request
# and creates/upserts a Checks-API-managed check-run) and `codex-review-response` (fires once
# per Codex reply, evaluates it, and either dispatches ci-full.yml or fails the check). No
# poll loop anywhere -- each job runs exactly once per real event and returns.

on:
  # pull_request_target (not pull_request): a same-repo PR that edits THIS file could, under
  # pull_request, run its OWN modified copy with CODEX_REVIEW_PAT still in scope -- able to
  # exfiltrate the PAT or self-resolve its own Codex review threads before a human ever looks.
  # pull_request_target always reads its workflow definition from the BASE branch, so a PR
  # modifying this file has zero effect on what runs for it until the change is actually
  # merged. Safe here because the request job never checks out or executes the PR's own code --
  # only `gh api` calls against metadata (PR number, head SHA) from the event payload.
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  # merge_group: coppa's native merge-queue ruleset re-evaluates every required check against a
  # temporary merge-group SHA with no associated PR context. Handled by an event-gated
  # pass-through step in the request job rather than a second job (two same-named check-runs
  # would rely on undocumented same-name multi-run matching semantics for a REQUIRED check).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  # ============================================================================================
  # Producer half: fires on every pull_request_target action (plus merge_group). Creates/upserts
  # the "Codex review clean (gate before expensive downstream jobs)" check-run and asks Codex to
  # look -- never waits for a response itself. Either an immediate pass-through (dispatches
  # ci-full.yml directly, no Codex round applies) or leaves the check-run in_progress for
  # codex-review-response below to complete once Codex actually replies.
  # ============================================================================================
  codex-review-request:
    name: Codex review clean (gate before expensive downstream jobs)
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    # A newer push must supersede an older run outright rather than let the old run finish and
    # mutate review threads based on a stale head -- cancelling is simpler and stronger than
    # re-verifying HEAD right before the mutation. merge_group.head_sha keeps concurrent
    # merge-queue entries in DISTINCT groups (pull_request.number is absent on that event), and
    # run_attempt == 1 only: a stale rerun replaying an old event must not be able to cancel a
    # run actively gating a NEWER head before that run's own head-check step gets a chance to
    # no-op the stale one instead.
    concurrency:
      group: codex-review-request-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    outputs:
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}
    steps:
      - name: Pass through for merge-queue evaluation
        if: github.event_name == 'merge_group'
        run: |
          echo "Merge-group evaluation -- the constituent PR already passed a real Codex review during its own PR phase; nothing further to review on this synthetic integration commit."

      - name: Mint a hagale-agent installation token for check-run writes
        id: app-token
        # Checks API create/update endpoints only accept a GitHub App token -- github.token
        # (Actions' own installation token) can create a check-run within its own run but is
        # rejected for updating one a DIFFERENT run created ("Check run status and conclusions
        # can only be updated internally by GitHub Actions", HTTP 403); a plain PAT is rejected
        # outright for BOTH create and update ("You must authenticate via a GitHub App", HTTP
        # 403). hagale-agent (App ID 4696353) mints a genuine installation token here, scoped to
        # just this repo, which is not subject to either restriction. Same App already used
        # fleet-wide (HAG-44/74/75) -- HAGALE_AGENT_APP_PRIVATE_KEY is an org secret, already
        # available to coppa with no new provisioning needed.
        if: github.event_name == 'pull_request_target'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4696353
          private-key: ${{ secrets.HAGALE_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Skip if this run's head no longer matches the PR's current head
        id: head-check
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A manual rerun of an old attempt replays the ORIGINAL event payload, including its
          # now-stale head SHA -- compare against the PR's LIVE head at run time and no-op if
          # this run is for a superseded commit.
          CURRENT_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$EVENT_HEAD_SHA" != "$CURRENT_HEAD_SHA" ]; then
            echo "::notice::This run's head ($EVENT_HEAD_SHA) no longer matches the PR's current head ($CURRENT_HEAD_SHA) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Bootstrap check: does the base branch have this repo's own event-driven gate yet?"
        id: bootstrap-check
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # pull_request_target ALWAYS executes the BASE branch's copy, never the PR's own -- so
          # the PR that first wires this mechanism up can never see it live for its own pushes
          # until it merges. Pinned to base.sha (the event-fixed commit), not base.ref (a moving
          # branch tip). Grep the raw content for `upsert_check_run`, a function name unique to
          # this new architecture -- plain file existence isn't enough, since coppa's OLD
          # wait-for-codex.yml also existed at every reachable base SHA before this migration.
          err_file="$(mktemp)"
          if content="$(gh api "repos/$REPO/contents/.github/workflows/wait-for-codex.yml?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw" 2>"$err_file")"; then
            if echo "$content" | grep -q "upsert_check_run"; then
              echo "bootstrap_status=ready" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base branch's wait-for-codex.yml at $BASE_SHA exists but predates this migration -- passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            fi
          else
            err="$(cat "$err_file")"
            if echo "$err" | grep -qiE "HTTP 404|not found"; then
              echo "::warning::Base branch has no wait-for-codex.yml at $BASE_SHA (clean 404) -- this is the bootstrap PR itself. Passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_status=fetch-failed" >> "$GITHUB_OUTPUT"
              echo "::error::Could not determine whether base branch has this migration yet (non-404 failure fetching $BASE_SHA, failing closed): $err"
              exit 1
            fi
          fi

      - name: "Self-heal: does the codex-clean label already exist for this exact head?"
        id: existing-label
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true' && steps.bootstrap-check.outputs.bootstrap_status == 'ready'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="codex-clean:${HEAD_SHA:0:12}"
          if labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name]' 2>/dev/null); then
            if echo "$labels" | jq -e --arg l "$target" 'index($l) != null' >/dev/null 2>&1; then
              echo "already_clean=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_clean=false" >> "$GITHUB_OUTPUT"

      - name: Create/upsert the codex-clean check-run
        id: create-check
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true'
        env:
          # hagale-agent's minted installation token for every check-run write, both create and
          # update -- github.token cannot update a check-run a different run created, and no PAT
          # can write to the Checks API at all, ever (create or update).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          ALREADY_CLEAN: ${{ steps.existing-label.outputs.already_clean || 'false' }}
          BOOTSTRAP_STATUS: ${{ steps.bootstrap-check.outputs.bootstrap_status || 'absent' }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -o pipefail

          # Durable fix for the duplicate-check-run bug (credenza org-wide fix, 2026-09-19):
          # every earlier version of this step unconditionally POSTed a brand-new check-run on
          # every invocation -- including a plain re-run of this same job or multiple
          # pull_request_target events landing on one commit in quick succession. That left N
          # same-named check-runs stacked on a single head_sha; once ANY completed with
          # conclusion=failure, it lingered forever since nothing ever updates a check-run once
          # created. Upserting -- look up any existing check-run for this exact (head_sha, name),
          # PATCH it in place, and only POST when none exists yet -- guarantees at most one
          # check-run per (head_sha, name) ever exists. Filtered further by external_id ==
          # this run's own RUN_ID when one is present (HAG-81 PR #164 review, round 2): a
          # head_sha with multiple dispatches/reruns can have more than one check-run with the
          # same name -- without this, the wrong run's check-run could be matched and mutated.
          # `--paginate`: a PR with enough review rounds can push this commit's check-run count
          # past the REST default page size (confirmed live on cqdx#470 at 41 check-runs for one
          # SHA). `--paginate` alone runs a filter once PER PAGE, printing multiple separate
          # results instead of one combined one -- `gh api`'s own --slurp is REJECTED outright
          # when combined with --jq ("the --slurp option is not supported with --jq or
          # --template", confirmed live on this PR's own round-2 review, a real Codex response
          # event failing this exact command). Piping the raw --paginate output into a SEPARATE
          # `jq -s` (jq's own slurp flag) is the only way to combine pages before filtering.
          upsert_check_run() {
            local name="$1" status="$2" conclusion="$3" existing_id
            existing_id=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              | jq -s "[.[].check_runs[] | select(.name == \"$name\")] | sort_by(.started_at) | last | .id // empty")
            if [ -n "$existing_id" ]; then
              if [ -n "$conclusion" ]; then
                gh api -X PATCH "repos/$REPO/check-runs/$existing_id" \
                  -f status="$status" -f conclusion="$conclusion" -f external_id="$RUN_ID" --jq '.id'
              else
                gh api -X PATCH "repos/$REPO/check-runs/$existing_id" \
                  -f status="$status" -f external_id="$RUN_ID" --jq '.id'
              fi
            else
              if [ -n "$conclusion" ]; then
                gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$name" -f head_sha="$HEAD_SHA" -f status="$status" -f conclusion="$conclusion" -f external_id="$RUN_ID" \
                  --jq '.id'
              else
                gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$name" -f head_sha="$HEAD_SHA" -f status="$status" -f external_id="$RUN_ID" \
                  --jq '.id'
              fi
            fi
          }

          # Bootstrap not live yet, OR the label already exists, OR a dependabot[bot] PR, OR a
          # draft PR: pass through immediately with a completed, successful check-run -- no
          # prior round to converge on yet. Every pass-through branch here is also a dispatch
          # trigger below, since this split design has no inline fallback for the expensive jobs
          # the way the old single-workflow design did.
          if [ "$IS_DRAFT" = "true" ]; then
            conclusion="success"
          elif [ "$IS_DEPENDABOT" = "true" ]; then
            conclusion="success"
          elif [ "$BOOTSTRAP_STATUS" != "ready" ]; then
            conclusion="success"
          elif [ "$ALREADY_CLEAN" = "true" ]; then
            conclusion="success"
          else
            conclusion=""
          fi

          if [ -n "$conclusion" ]; then
            check_id=$(upsert_check_run "Codex review clean (gate before expensive downstream jobs)" "completed" "$conclusion")
            echo "Upserted completed check-run ($conclusion) for $HEAD_SHA -- no wait needed."
          else
            check_id=$(upsert_check_run "Codex review clean (gate before expensive downstream jobs)" "in_progress" "")
            # Codex P1, this PR's own review: this workflow has no LOCAL timeout of its own for
            # the case where the request comment fails to post, Codex is unavailable, or no
            # supported response event ever fires -- without one, this check would sit
            # in_progress forever. It doesn't need one: credenza's own codex-review-timeout-scan.yml
            # (~/Code/credenza/.github/workflows/codex-review-timeout-scan.yml) is a
            # CENTRALIZED, ORG-WIDE cron (every 15min) that scans every open PR across
            # HagaleTechnologies for any check-run named EXACTLY "Codex review clean (gate
            # before expensive downstream jobs)" still in_progress past 90 minutes, regardless
            # of which repo or mechanism created it -- it re-requests a review at 90min and
            # fails the check outright at 120min if still stuck. This is the same backstop
            # every credenza-`uses:`-based migration in this fleet (panino, banco, harbor,
            # etc.) also relies on with no local timeout of their own; this hand-port matches
            # that same accepted pattern rather than duplicating it locally, PROVIDED the check
            # name above stays byte-identical to what the scanner greps for.
            echo "Upserted in_progress check-run for $HEAD_SHA -- codex-review-response will complete it once Codex responds, or credenza's org-wide timeout-scan backstop will within 120 minutes."
          fi
          {
            echo "check_run_id=$check_id"
            echo "conclusion=$conclusion"
            echo "is_dependabot=$IS_DEPENDABOT"
          } >> "$GITHUB_OUTPUT"

      - name: Request a review
        if: steps.create-check.outputs.check_run_id != '' && steps.create-check.outputs.conclusion != 'success' && steps.bootstrap-check.outputs.bootstrap_status == 'ready' && steps.existing-label.outputs.already_clean != 'true'
        env:
          # CODEX_REVIEW_PAT is an org secret (visibility: all), already available to coppa --
          # no new secret needed. Codex's own native auto-trigger-on-open was disabled org-wide
          # (2026-09-08); an explicit "@codex review" comment is the only path to a real review.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CODEX_REVIEW_PAT not available -- skipping the request comment. A formal Codex review tied to this head still resolves the check normally via codex-review-response, once one lands."
            exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review" >/dev/null
          # Codex P1, HAG-78 PR #113 review round 2: request and response are now DIFFERENT
          # workflow runs (decoupled, event-driven), so github.run_attempt in the response job
          # is ALWAYS 1 for a genuinely-fired response event -- it can never distinguish a real
          # new commit from a bare re-request of an UNCHANGED head_sha the way the old single
          # polling job's own run_attempt could. That distinction has to be recorded somewhere
          # durable the response job can independently read back: a marker comment counting how
          # many times THIS EXACT head_sha has been requested. Posted as its OWN comment, not
          # appended to the "@codex review" trigger text above, to avoid any risk of interfering
          # with Codex's own trigger-phrase matching.
          gh api "repos/$REPO/issues/$PR/comments" -f body="<!-- codex-review-request head_sha=$HEAD_SHA -->" >/dev/null

      - name: Dispatch full CI (pass-through success -- no Codex round to wait on)
        if: steps.create-check.outputs.check_run_id != '' && steps.create-check.outputs.conclusion == 'success'
        env:
          # GH_TOKEN must be a PAT, not github.token: GitHub rejects a workflow_dispatch POST
          # authenticated with the built-in GITHUB_TOKEN outright ("Resource not accessible by
          # integration"), regardless of the calling job's own declared actions:write permission.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DEPENDABOT: ${{ steps.create-check.outputs.is_dependabot }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CODEX_REVIEW_PAT not set -- cannot dispatch ci-full.yml (github.token is rejected outright for workflow_dispatch). The check-run above is already marked success, but CI will never run for $HEAD_SHA without a manual dispatch."
            exit 1
          fi
          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          gh api -X POST "repos/$REPO/actions/workflows/ci-full.yml/dispatches" \
            -f ref="$default_branch" -f "inputs[head_sha]=$HEAD_SHA" -f "inputs[is_dependabot]=$IS_DEPENDABOT"

  # ============================================================================================
  # Consumer half: fires once per Codex reply (pull_request_review or issue_comment from Codex's
  # own actor), never on a poll interval. Re-derives everything it needs from live GitHub data
  # using timestamp comparison against the request comment's own creation time -- no
  # cross-invocation state.
  # ============================================================================================
  codex-review-response:
    name: Codex review response
    # Compared against the RAW WEBHOOK/Actions-context login field, NOT GraphQL's author.login --
    # these two APIs disagree on bot-actor login formatting (the webhook payload reports the
    # [bot]-suffixed form).
    if: |
      (github.event_name == 'pull_request_review' && (github.event.review.user.login == 'chatgpt-codex-connector' || github.event.review.user.login == 'chatgpt-codex-connector[bot]')) ||
      (github.event_name == 'issue_comment' && (github.event.comment.user.login == 'chatgpt-codex-connector' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    # A non-Codex sender's response event into its own concurrency group (HAG-81 PR #164 review,
    # round 3 lesson applied from the start): keyed on the PR/issue number, not the SHA, since
    # multiple response events for the same PR can land close together and must serialize, not
    # race each other's thread-resolution mutations.
    concurrency:
      group: codex-review-response-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Mint a hagale-agent installation token for check-run writes
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4696353
          private-key: ${{ secrets.HAGALE_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve PR context
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
          fi
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if this event targeted a superseded head
        id: head-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # pull_request_review carries its own commit_id; issue_comment does not (a plain
          # comment isn't tied to any specific commit by GitHub itself), so that path is checked
          # via comment_head_tied in the verdict step below instead -- there is no commit_id to
          # compare here for it.
          if [ "${{ github.event_name }}" = "pull_request_review" ] && \
             [ "${{ github.event.review.commit_id }}" != "${{ steps.pr-context.outputs.head_sha }}" ]; then
            echo "::notice::This review targeted ${{ github.event.review.commit_id }}, which is no longer the PR's current head (${{ steps.pr-context.outputs.head_sha }}) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the most recent request comment for this head
        id: request-comment
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
        run: |
          # --paginate, piped into a separate `jq -s`: a heavily-discussed PR can push comment
          # count past 100 (same class of gap as the request-marker query's own fix below),
          # silently missing the truly most-recent "@codex review" comment.
          comment=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq -s '[.[][] | select(.body == "@codex review")] | sort_by(.created_at) | last')
          if [ "$comment" = "null" ] || [ -z "$comment" ]; then
            echo "::warning::No '@codex review' request comment found on PR #$PR -- falling back to 30 minutes ago as RUN_STARTED."
            echo "run_started=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_started=$(echo "$comment" | jq -r '.created_at')" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=$(echo "$comment" | jq -r '.node_id')" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute baseline threads as of the request comment
        id: baseline
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
        run: |
          owner="${REPO%%/*}"; name="${REPO##*/}"
          response=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR")
          # Strict-pure baseline: unresolved threads that existed (first comment predates SINCE)
          # with EVERY comment authored by Codex or this workflow's own auto-resolve reply.
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].createdAt < $since)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions"))
              | .id]' > /tmp/baseline-pure.json
          # Broader "initiated" baseline: unresolved threads whose first comment is Codex and
          # predates SINCE, regardless of who replied since.
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              | select(.comments.nodes[0].createdAt < $since)
              | .id]' > /tmp/baseline-initiated.json
          {
            echo "baseline_pure<<BASELINE_EOF"
            cat /tmp/baseline-pure.json
            echo "BASELINE_EOF"
            echo "baseline_initiated<<BASELINE_EOF2"
            cat /tmp/baseline-initiated.json
            echo "BASELINE_EOF2"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate whether Codex responded on this revision
        id: verdict
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
          COMMENT_ID: ${{ steps.request-comment.outputs.comment_node_id }}
        run: |
          set -o pipefail
          owner="${REPO%%/*}"; name="${REPO##*/}"
          HAS_COMMENT="false"
          [ -n "$COMMENT_ID" ] && HAS_COMMENT="true"
          if ! poll=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!, $hasComment: Boolean!, $commentId: ID!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  comments(last: 50) { nodes { author { login } body createdAt } }
                  reviews(last: 50) { nodes { author { login } commit { oid } submittedAt } }
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
              commentNode: node(id: $commentId) @include(if: $hasComment) {
                ... on IssueComment {
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR" -F hasComment="$HAS_COMMENT" -f commentId="${COMMENT_ID:-placeholder}" \
            2>/tmp/poll-err.log \
            | jq --arg since "$SINCE" --arg sha "$HEAD_SHA" '
              def is_error_shaped: test("(you exceeded your current quota|quota exceeded|rate limit reached|rate.?limit exceeded|unable to (access|start|review)|cannot access|authentication (failed|error)|workspace error|failed to (access|clone|start)|create a codex account and connect|something went wrong)"; "i");
              def reviewed_commit_prefix: try (.body | capture("[Rr]eviewed commit:?\\**\\s*`(?<c>[0-9a-f]{7,40})`").c) catch null;
              def is_codex_bot: . == "chatgpt-codex-connector" or . == "chatgpt-codex-connector[bot]";
              .data.repository.pullRequest as $p
              | ([$p.comments.nodes[] | select(.author.login=="chatgpt-codex-connector" and .createdAt >= $since)]) as $fresh_comments
              | {
                  comment_head_tied: ([$fresh_comments[]
                    | select(.body | is_error_shaped | not)
                    | select((reviewed_commit_prefix // "") as $c | $c != "" and ($sha | startswith($c)))
                  ] | length),
                  # error_head_tied (coppas own fix, HAG-36, ported here rather than dropped --
                  # credenzas shared template still lacks this field): an error-shaped comment
                  # whose own body embeds this exact HEAD_SHA is as tightly scoped to "this
                  # request" as comment_head_tied is for a success -- Codexs ref-not-found
                  # error embeds the full SHA verbatim ("Provided git ref <sha> does not
                  # exist"), so this can never be a stale unrelated error. Confirmed live on
                  # HagaleTechnologies/pancetta#362: this exact error repeated twice 71 minutes
                  # apart for the same SHA, and a check without this field silently waited out
                  # the full timeout instead of failing fast on it.
                  error_head_tied: ([$fresh_comments[] | select(.body | is_error_shaped) | select(.body | contains($sha))] | length),
                  reviews: ([$p.reviews.nodes[] | select(.author.login=="chatgpt-codex-connector" and .commit.oid==$sha and .submittedAt >= $since)] | length),
                  comment_thumbsup: ([(.data.commentNode.reactions.nodes // [])[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length)
                }'); then
            echo "::error::Error querying for a Codex signal: $(cat /tmp/poll-err.log 2>/dev/null)"
            exit 1
          fi
          reviews=$(echo "$poll" | jq '.reviews')
          comment_thumbsup=$(echo "$poll" | jq '.comment_thumbsup')
          comment_head_tied=$(echo "$poll" | jq '.comment_head_tied')
          error_head_tied=$(echo "$poll" | jq '.error_head_tied')
          # This job only exists because a real event already fired -- use ONLY signals
          # provably tied to this exact request/head (no loose/untied fallback branch: unlike
          # the old polling design, there is no "CODEX_REVIEW_PAT unset, fall back to a native
          # auto-trigger" case to accommodate here, since CODEX_REVIEW_PAT is an org secret
          # always available to this repo).
          if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
            echo "Codex responded on this revision: reviews=$reviews comment_thumbsup=$comment_thumbsup comment_head_tied=$comment_head_tied"
            echo "responded=true" >> "$GITHUB_OUTPUT"
          elif [ "$error_head_tied" -gt 0 ]; then
            echo "::error::Codex reported an error for this exact revision ($HEAD_SHA) instead of reviewing it."
            echo "responded=true" >> "$GITHUB_OUTPUT"
            echo "codex_errored=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tied Codex signal found for $HEAD_SHA in this event -- leaving the check in_progress for the next event or the timeout backstop."
            echo "responded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the verdict and auto-resolve eligible threads
        id: compute-verdict
        if: steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true' && steps.verdict.outputs.codex_errored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          RUN_STARTED: ${{ steps.request-comment.outputs.run_started }}
        run: |
          set -o pipefail
          # Codex P1, HAG-78 PR #113 review round 2: request and response are DIFFERENT
          # workflow runs (decoupled, event-driven) -- github.run_attempt in THIS job is always
          # 1 for a genuinely-fired response event, so it can never distinguish a real new
          # commit from a bare re-request of an unchanged head_sha the way the old single
          # polling job's own run_attempt could (that bug would have silently disabled the
          # unresolved_baseline_count safety gate below on every single round, always treating
          # it as genuine). Read back the durable marker the request job posts instead: if more
          # than one "<!-- codex-review-request head_sha=$HEAD_SHA -->" comment exists for this
          # EXACT head_sha, this round is a re-request of unchanged code, not a genuine new
          # commit.
          # HEAD_SHA is a git SHA (safe hex characters only) -- interpolated directly into the
          # filter string rather than via --arg, since `gh api --jq` (distinct from real jq)
          # has no --arg companion flag at all (confirmed live: "accepts 1 arg(s), received 4").
          # --paginate, piped into a separate `jq -s`, not gh api's own --jq: a PR with more
          # than 100 comments would otherwise only see the first page, silently undercounting
          # markers and misclassifying a repeated request as genuine (Codex P1, this PR's own
          # round 3 review) -- and --paginate alone runs a --jq filter once PER PAGE anyway
          # (the same class of bug fixed elsewhere in this file), so combining pages via a
          # separate `jq -s` is required regardless.
          marker_count=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq -s "[.[][] | select(.body == \"<!-- codex-review-request head_sha=$HEAD_SHA -->\")] | length")
          IS_GENUINE_SYNC=true
          [ "$marker_count" -gt 1 ] && IS_GENUINE_SYNC=false
          echo "Found $marker_count request marker(s) for $HEAD_SHA -- IS_GENUINE_SYNC=$IS_GENUINE_SYNC"
          apply_clean_label() {
            local label="codex-clean:${HEAD_SHA:0:12}"
            for _ in 1 2 3; do
              gh label create "$label" --color 0e8a16 \
                --description "This revision's Codex round raised nothing new -- safe to run the expensive gated jobs" \
                --repo "$REPO" >/dev/null 2>&1 || true
              if gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" >/dev/null 2>&1; then
                echo "Applied $label."
                return 0
              fi
              sleep 5
            done
            echo "::warning::Could not apply $label after 3 attempts."
            return 1
          }

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline='${{ steps.baseline.outputs.baseline_pure }}'
          baseline_initiated='${{ steps.baseline.outputs.baseline_initiated }}'
          [ -z "$baseline" ] && baseline='[]'
          [ -z "$baseline_initiated" ] && baseline_initiated='[]'

          result=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      path
                      comments(first: 50) { nodes { author { login } createdAt originalCommit { oid } } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            | jq --argjson baseline "$baseline" --argjson baselineInitiated "$baseline_initiated" --arg since "$RUN_STARTED" '
              def ignorable_author: . == "chatgpt-codex-connector" or . == "github-actions";
              def codex_initiated: (.comments.nodes[0].author.login == "chatgpt-codex-connector");
              def restated_by_codex:
                [.comments.nodes[] | select(.author.login == "chatgpt-codex-connector" and .createdAt >= $since)] | length > 0;
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes
                  | map(select(.isResolved == false)
                        | select(codex_initiated)
                        | .id)) as $codex_unresolved
              | {
                  new_count: (($codex_unresolved - $baselineInitiated) | length),
                  restated_count: ([$nodes[]
                    | select(.isResolved == false)
                    | select(codex_initiated)
                    | select(.id as $id | $baselineInitiated | index($id))
                    | select(restated_by_codex)
                  ] | length),
                  unresolved_baseline_count: ([$codex_unresolved[] | select(. as $id | $baselineInitiated | index($id))] | length),
                  resolvable: [
                    $nodes[]
                    | select(.isResolved == false)
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(ignorable_author))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | {id, path, findingSha: (.comments.nodes[0].originalCommit.oid // "")}
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          restated_count=$(echo "$result" | jq '.restated_count')
          unresolved_baseline_count=$(echo "$result" | jq '.unresolved_baseline_count')

          if [ "$new_count" -gt 0 ]; then
            echo "::error::Codex raised $new_count new concern(s) on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$restated_count" -gt 0 ]; then
            echo "::error::Codex restated $restated_count still-live concern(s) in an existing thread on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_GENUINE_SYNC" != "true" ] && [ "$unresolved_baseline_count" -gt 0 ]; then
            echo "::error::This is a rerun with $unresolved_baseline_count still-unresolved baseline concern(s) that nothing here will clear — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apply_clean_label || true
          echo "outcome=success" >> "$GITHUB_OUTPUT"

          if [ "$IS_GENUINE_SYNC" != "true" ]; then
            echo "This round is a rerun, not a genuine synchronize — the code hasn't changed, so not auto-resolving baseline threads that may still describe it."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[] | [.id, .path, .findingSha] | @tsv' | while IFS=$'\t' read -r thread_id path finding_sha; do
            [ -z "$thread_id" ] && continue
            if [ -z "$finding_sha" ]; then
              echo "::warning::Thread $thread_id has no recorded originating commit — leaving unresolved."
              continue
            fi
            if ! compare_response=$(gh api "repos/$REPO/compare/$finding_sha...$HEAD_SHA" 2>/tmp/compare-err.log); then
              echo "::warning::Could not compare $finding_sha...$HEAD_SHA for thread $thread_id — leaving unresolved: $(cat /tmp/compare-err.log 2>/dev/null)"
              continue
            fi
            merge_base=$(echo "$compare_response" | jq -r '.merge_base_commit.sha // ""')
            if [ "$merge_base" != "$finding_sha" ]; then
              echo "::warning::$finding_sha is not an ancestor of $HEAD_SHA (merge base: ${merge_base:-none}) — leaving thread $thread_id unresolved: $path"
              continue
            fi
            compare_files=$(echo "$compare_response" | jq '[.files[]? | (.filename, (.previous_filename // empty))]')
            if ! echo "$compare_files" | jq -e --arg path "$path" 'any(. == $path)' >/dev/null; then
              echo "Skipping thread $thread_id — flagged file '$path' was not touched by any commit since the finding was raised."
              continue
            fi
            if ! live=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } createdAt } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck-err.log); then
              echo "::warning::Could not re-check thread $thread_id live state — leaving unresolved: $(cat /tmp/live-recheck-err.log 2>/dev/null)"
              continue
            fi
            live_resolved=$(echo "$live" | jq -r '.data.node.isResolved')
            live_pure=$(echo "$live" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            live_fresh=$(echo "$live" | jq --arg since "$RUN_STARTED" '[.data.node.comments.nodes[] | select(.createdAt >= $since)] | length == 0')
            if [ "$live_resolved" != "false" ] || [ "$live_pure" != "true" ] || [ "$live_fresh" != "true" ]; then
              echo "Skipping thread $thread_id — no longer eligible."
              continue
            fi
            pre_reply_count=$(echo "$live" | jq '.data.node.comments.nodes | length')
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id — leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            if ! live2=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck2-err.log); then
              echo "::warning::Could not re-verify thread $thread_id before resolving — leaving unresolved: $(cat /tmp/live-recheck2-err.log 2>/dev/null)"
              continue
            fi
            post_reply_resolved=$(echo "$live2" | jq -r '.data.node.isResolved')
            post_reply_pure=$(echo "$live2" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            post_reply_count=$(echo "$live2" | jq '.data.node.comments.nodes | length')
            if [ "$post_reply_resolved" != "false" ] || [ "$post_reply_pure" != "true" ] || [ "$post_reply_count" -ne "$((pre_reply_count + 1))" ]; then
              echo "::warning::Thread $thread_id changed between reply and resolve — leaving unresolved (has a reply, but not auto-resolved)."
              continue
            fi
            if ! GH_TOKEN="$RESOLVE_TOKEN" gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done

      - name: Update the check-run
        if: always() && steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          # A genuine Codex error (codex_errored) counts as a failed outcome even though
          # compute-verdict never ran to compute one -- coppa's own error_head_tied fix, carried
          # through end to end.
          OUTCOME: ${{ steps.verdict.outputs.codex_errored == 'true' && 'failure' || steps.compute-verdict.outputs.outcome }}
        run: |
          # See upsert_check_run's own comment above: piped into a separate `jq -s`, not
          # `gh api`'s own --slurp (rejected outright when combined with --jq).
          check_id=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            | jq -s '[.[].check_runs[] | select(.name == "Codex review clean (gate before expensive downstream jobs)")] | sort_by(.started_at) | last | .id // empty')

          conclude_check() {
            local conclusion="$1"
            if [ -n "$check_id" ]; then
              for attempt in 1 2 3; do
                if [ "$conclusion" = "success" ]; then
                  gh api -X PATCH "repos/$REPO/check-runs/$check_id" -f status="completed" -f conclusion="success" && return 0
                else
                  gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
                    -f status="completed" -f conclusion="failure" \
                    -f output[title]="Codex raised new concerns" \
                    -f output[summary]="See this job's log for details -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review." && return 0
                fi
                sleep 2
              done
              echo "::warning::failed to conclude check-run $check_id after 3 attempts" >&2
              return 1
            fi
            # HAG-81 lesson applied here rather than left as a gap credenza's own shared
            # template still has: if the request job's create-check step never ran or never
            # produced a check-run at all, warning and doing nothing leaves the required
            # "Codex review clean..." check permanently absent for this head_sha. Create it
            # directly instead -- independent of the dispatch decision below, which depends
            # only on $OUTCOME, not on whether a PATCH or a POST concluded this check.
            echo "::warning::No matching check-run found for $HEAD_SHA -- creating one directly with this outcome."
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Codex review clean (gate before expensive downstream jobs)" -f head_sha="$HEAD_SHA" \
              -f status="completed" -f conclusion="$conclusion" -f external_id="$RUN_ID" \
              || { echo "::warning::failed to publish a fallback check-run for $HEAD_SHA" >&2; return 1; }
          }

          conclude_check "$OUTCOME"

          if [ "$OUTCOME" = "success" ]; then
            # Dispatch against the repo's DEFAULT branch, never the PR's own head branch -- a
            # same-repo PR could otherwise replace ci-full.yml with an immediate-success "CI"
            # job the moment Codex responds clean.
            if [ -z "$DISPATCH_TOKEN" ]; then
              echo "::error::CODEX_REVIEW_PAT not set -- cannot dispatch ci-full.yml. The check-run above is already marked success, but CI will never run for $HEAD_SHA without a manual dispatch."
              exit 1
            fi
            default_branch=$(GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/$REPO" --jq '.default_branch')
            GH_TOKEN="$DISPATCH_TOKEN" gh api -X POST "repos/$REPO/actions/workflows/ci-full.yml/dispatches" \
              -f ref="$default_branch" -f "inputs[head_sha]=$HEAD_SHA"
          fi
