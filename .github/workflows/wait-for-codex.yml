name: Wait for Codex Review

# pull_request_target (not pull_request): a same-repo PR that edits THIS
# file could, under pull_request, run its OWN modified copy with
# CODEX_REVIEW_PAT still in scope -- able to exfiltrate the PAT or
# self-resolve its own Codex review threads before a human ever looks.
# pull_request_target always reads its workflow definition from the BASE
# branch, so a PR modifying this file has zero effect on what runs for it
# until the change is actually merged. Safe here because this workflow
# never checks out or executes the PR's own code -- only `gh api` calls
# against metadata (PR number, head SHA) from the event payload.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  # merge_group: a repo using a GitHub merge queue re-evaluates every
  # required check against a temporary merge-group SHA with no associated
  # PR context -- a PR-specific job would never match that event, leaving
  # a required "Wait for Codex Review" check permanently pending on the
  # queue SHA and stalling the queue. Handled by an event-gated
  # pass-through step below rather than a second job (two same-named
  # check-runs would rely on undocumented same-name multi-run matching
  # semantics for a REQUIRED check). Currently dormant on this repo (no
  # native merge_queue ruleset rule yet) -- kept for parity in case that
  # changes.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  # write, not read: creating the codex-clean label needs Issues:write on
  # GitHub's Create-a-label endpoint -- read is insufficient and the
  # label-add call is written fail-open (`|| true`), so a read-only grant
  # would make the whole codex-clean signal silently never fire.
  issues: write
  # write: wait-for-codex-queue-watchdog cancels its own run via the
  # Actions API. A job's own permissions: block can only be a SUBSET of
  # what's granted here, never wider -- omitting this scope at the
  # top level makes GitHub reject the entire workflow file at parse
  # time (zero jobs created, no per-job error) the moment that job's
  # own `actions: write` request has no top-level grant to narrow from.
  actions: write

# A newer push must supersede an older run outright rather than let the old
# run finish and mutate review threads based on a stale head -- cancelling
# is simpler and stronger than re-verifying HEAD right before the mutation.
concurrency:
  # pull_request.number is absent on a merge_group event -- falling back to
  # merge_group.head_sha keeps concurrent merge-queue entries in DISTINCT
  # groups, so cancel-in-progress can't cancel one queue entry's check the
  # moment another one starts.
  group: wait-for-codex-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  # Never cancel a manual rerun (run_attempt > 1): a stale rerun replaying
  # an old event must not be able to cancel a run actively gating a NEWER
  # head before that run's own head-check step gets a chance to no-op the
  # stale one instead.
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  # Separate ubuntu-latest job (never the self-hosted pool it's watching --
  # this watchdog exists specifically to detect pool saturation/outage).
  # No `needs:`. Two phases: does the main job get a runner at all (it can
  # queue even briefly under normal load), and if it's still queued 15+
  # minutes with no runner picking it up, cancel the whole run so the
  # required check fails fast with a clear reason instead of blocking the
  # PR indefinitely.
  wait-for-codex-queue-watchdog:
    if: github.event_name == 'merge_group' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Cancel the run if wait-for-codex never starts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry-on-transient-failure, not a bare unguarded call: a
          # rate-limit or transient API failure here must not abort the
          # whole watchdog before it ever reaches the cancellation check.
          check_status() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="Wait for Codex Review") | .status' 2>&1)"; then
                printf '%s' "$out"
                return 0
              fi
              sleep 2
            done
            echo "::warning::transient gh api failure fetching job status (3 attempts) -- treating this poll as inconclusive" >&2
          }
          deadline=900
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(check_status)"
            case "$status" in
              in_progress|completed) echo "Wait for Codex Review is $status -- watchdog stands down"; exit 0 ;;
            esac
            sleep 20
          done
          status="$(check_status)"
          case "$status" in
            in_progress|completed) echo "Wait for Codex Review is $status -- watchdog stands down"; exit 0 ;;
          esac
          echo "::error::Wait for Codex Review has been queued for 15+ minutes with no runner picking it up (pool down or saturated) -- cancelling this run so the required check fails fast with a clear reason instead of blocking the PR indefinitely."
          for attempt in 1 2 3; do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" && exit 1
            sleep 2
          done
          echo "::error::cancel request itself failed after 3 attempts -- Wait for Codex Review may still be left queued with no bound." >&2
          exit 1

  # ONE job with event-gated steps, not two same-named jobs: two check-runs
  # sharing this exact check name would rely on undocumented same-name
  # multi-run matching semantics for a REQUIRED check.
  wait-for-codex:
    name: Wait for Codex Review
    if: github.event_name == 'merge_group' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')
    runs-on: [self-hosted, linux, rigel-light]
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Pass through for merge-queue evaluation
        if: github.event_name == 'merge_group'
        run: |
          echo "Merge-group evaluation -- the constituent PR already passed a real Wait for Codex Review during its own PR phase; nothing further to review on this synthetic integration commit."

      - name: Record run start
        if: github.event_name == 'pull_request_target'
        env:
          # Seed from the PR event's OWN updated_at (set by GitHub at
          # dispatch time), not a runner-observed "now" -- a queued or
          # slow-starting runner would otherwise compute its cutoff only
          # after the runner was already up, silently ignoring a Codex
          # response that landed in that startup gap.
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          RUN_STARTED=$(date -u -d "$PR_UPDATED_AT - 15 seconds" +%Y-%m-%dT%H:%M:%SZ)
          echo "$RUN_STARTED" > /tmp/codex-run-started.txt

      - name: Skip if this run's head no longer matches the PR's current head
        id: head-check
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A manual rerun of an old attempt replays the ORIGINAL event
          # payload, including its now-stale head SHA -- compare against
          # the PR's LIVE head at run time and no-op if this run is for a
          # superseded commit.
          CURRENT_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$EVENT_HEAD_SHA" != "$CURRENT_HEAD_SHA" ]; then
            echo "::notice::This run's head ($EVENT_HEAD_SHA) no longer matches the PR's current head ($CURRENT_HEAD_SHA) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request re-review on a re-push
        # Also fires on reopened and on any rerun (run_attempt > 1), not
        # just synchronize: a maintainer rerunning a failed attempt (e.g.
        # after a transient Codex quota/auth error) reuses the SAME event
        # and, without this, would reconstruct the same stale cutoff and
        # rediscover the identical old error forever rather than asking
        # Codex to look again.
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true' && (github.event.action == 'synchronize' || github.event.action == 'reopened' || github.run_attempt > 1)
        env:
          # Codex only auto-reviews on opened/ready_for_review, not on
          # every push -- a fresh re-review needs an explicit, authenticated
          # human-account comment. CODEX_REVIEW_PAT is a fine-grained PAT
          # under an account Codex already recognizes, used ONLY to post
          # this one comment.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # A missing/unset PAT should degrade to skipping the re-review
          # request, not crash this step under `bash -e` -- a formal
          # Codex review tied to this head still resolves the check
          # normally via the poll step below.
          if [ -z "$GH_TOKEN" ]; then
            echo "CODEX_REVIEW_PAT not set -- skipping the fresh re-review request. A formal Codex review tied to this head still resolves the check normally; a maintainer can otherwise use the repo's admin bypass."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          # Snapshot unresolved Codex-*started* review threads BEFORE
          # asking for a fresh look. Only a thread with EVERY comment
          # authored by Codex (or this workflow's own prior auto-resolve
          # reply, which carries no new human concern) is eligible for
          # later auto-resolution -- a thread any human has ever replied
          # in is excluded permanently, not just for this round.
          baseline_query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }'
          baseline_response=$(GH_TOKEN="$READ_TOKEN" gh api graphql -f query="$baseline_query" -f owner="$OWNER" -f name="$NAME" -F pr="$PR")
          echo "$baseline_response" \
            | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions"))
              | .id]' \
            > /tmp/codex-baseline-threads.json

          # Second, BROADER baseline for deciding what's "new" this round:
          # a thread Codex started before this round that since got a
          # human reply still isn't a NEW concern, but the poll step's
          # new_count check identifies Codex-started threads by their
          # FIRST comment only -- without this second snapshot such a
          # thread would look "new" forever, permanently blocking every
          # future round's auto-resolution.
          echo "$baseline_response" \
            | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              | .id]' \
            > /tmp/codex-baseline-initiated.json

          request_comment=$(gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review")

          # Capture the comment's own GraphQL node_id (not its REST
          # numeric id): a clean re-review can land as a reaction on THIS
          # comment specifically, not on the PR/issue itself.
          echo "$request_comment" | jq -r '.node_id' > /tmp/codex-review-comment-id.json

          # Re-anchor RUN_STARTED to the moment THIS request was actually
          # posted, not the broader PR_UPDATED_AT snapshot: a rerun or
          # rapid successive pushes can leave that broader snapshot
          # stale, letting an already-baselined prior review of the same
          # HEAD_SHA satisfy the poll without Codex ever looking again
          # this round.
          echo "$request_comment" | jq -r '.created_at' > /tmp/codex-run-started.txt

      - name: Poll for a terminal Codex signal on this revision
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN (github-actions[bot]) reliably fails
          # resolveReviewThread on Codex-started threads with "Resource
          # not accessible by integration" -- a real-user PAT does not
          # have this restriction. RESOLVE_TOKEN is used ONLY for the
          # resolveReviewThread mutation at the bottom of this step.
          RESOLVE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # IS_SYNC drives the poll loop's branch selection only: on a
          # re-push/rerun, only a signal PROVABLY tied to this exact
          # request counts as "responded." Never gates auto-resolve
          # eligibility.
          IS_SYNC: ${{ github.event.action == 'synchronize' || github.event.action == 'reopened' || github.run_attempt > 1 }}
          # IS_GENUINE_SYNC additionally requires a genuine new commit
          # (run_attempt == 1) -- gates ONLY the auto-resolve/resolve-
          # mutation loop's eligibility, never whether this revision
          # itself is allowed to be declared codex-clean.
          IS_GENUINE_SYNC: ${{ (github.event.action == 'synchronize' || github.event.action == 'reopened') && github.run_attempt == 1 }}
          # IS_REMEDIATION selects which post-poll branch runs: the
          # simple "zero unresolved Codex-started threads" check (opened/
          # ready_for_review/reopened-reruns) vs. the new_count/
          # restated_count/unresolved_baseline_count computation
          # (synchronize/reopened).
          IS_REMEDIATION: ${{ github.event.action == 'synchronize' || github.event.action == 'reopened' }}
        run: |
          set -o pipefail
          # apply_clean_label(): SHA-scoped label name (never a bare
          # toggle -- a bare toggle needs cross-run add/remove
          # coordination that is itself a race), 3-attempt retry with 5s
          # backoff, `gh label create` (idempotent, `|| true`) before the
          # attach POST.
          apply_clean_label() {
            local label="codex-clean:${HEAD_SHA:0:12}"
            for _ in 1 2 3; do
              gh label create "$label" --color 0e8a16 \
                --description "This revision's Codex round raised nothing new -- safe to run the expensive gated jobs" \
                --repo "$REPO" >/dev/null 2>&1 || true
              if gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" >/dev/null 2>&1; then
                echo "Applied $label -- codex-clean can now unblock ci.yml's gated jobs for this revision."
                return 0
              fi
              sleep 5
            done
            echo "::warning::Could not apply $label after 3 attempts -- codex-clean will wait out its own timeout instead."
            return 1
          }
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          RUN_STARTED=$(cat /tmp/codex-run-started.txt 2>/dev/null || date -u -d '15 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          # Deliberately generous margin -- burst load (many PRs/pushes
          # landing at once) can push Codex's real response time past
          # 45-50 minutes on occasion.
          END=$((SECONDS+4200))
          responded=""
          reviewed_head=""
          COMMENT_ID=$(cat /tmp/codex-review-comment-id.json 2>/dev/null || echo "")
          HAS_COMMENT="false"
          [ -n "$COMMENT_ID" ] && HAS_COMMENT="true"
          while [ $SECONDS -lt $END ]; do
            # A single combined GraphQL query per poll, not several
            # separate REST calls: GITHUB_TOKEN is capped at 1,000
            # requests/hour/repository, shared across every concurrent
            # workflow run in the repo -- a multi-call-per-poll loop
            # could exhaust that with just a couple of concurrent PRs
            # under review.
            if ! poll=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!, $hasComment: Boolean!, $commentId: ID!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    comments(last: 50) { nodes { author { login } body createdAt } }
                    reviews(last: 50) { nodes { author { login } commit { oid } submittedAt } }
                    reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                  }
                }
                commentNode: node(id: $commentId) @include(if: $hasComment) {
                  ... on IssueComment {
                    reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -F hasComment="$HAS_COMMENT" -f commentId="${COMMENT_ID:-placeholder}" \
              2>/tmp/poll-err.log \
              | jq --arg since "$RUN_STARTED" --arg sha "$HEAD_SHA" '
                def is_error_shaped: test("(quota exceeded|rate.?limit exceeded|unable to (access|start|review)|cannot access|authentication (failed|error)|workspace error|failed to (access|clone|start)|create a codex account and connect)"; "i");
                # Codex'"'"'s clean-pass response on a re-push can ALSO
                # land as a plain issue comment (not a formal review, not
                # a reaction) whose body embeds "**Reviewed commit:**
                # `<sha-prefix>`" -- a real, head-tied signal just
                # carried in the comment text instead of a separate
                # GraphQL field.
                def reviewed_commit_prefix: try (.body | capture("[Rr]eviewed commit:?\\**\\s*`(?<c>[0-9a-f]{7,40})`").c) catch null;
                # Reaction-author [bot]-suffix handling: GraphQL puts the
                # `[bot]` suffix on REACTION author logins specifically,
                # never on comment/review author logins.
                def is_codex_bot: . == "chatgpt-codex-connector" or . == "chatgpt-codex-connector[bot]";
                .data.repository.pullRequest as $p
                | ([$p.comments.nodes[] | select(.author.login=="chatgpt-codex-connector" and .createdAt >= $since)]) as $fresh_comments
                | {
                    comments: ([$fresh_comments[] | select(.body | is_error_shaped | not)] | length),
                    comment_head_tied: ([$fresh_comments[]
                      | select(.body | is_error_shaped | not)
                      | select((reviewed_commit_prefix // "") as $c | $c != "" and ($sha | startswith($c)))
                    ] | length),
                    error_comments: ([$fresh_comments[] | select(.body | is_error_shaped)] | length),
                    reviews: ([$p.reviews.nodes[] | select(.author.login=="chatgpt-codex-connector" and .commit.oid==$sha and .submittedAt >= $since)] | length),
                    thumbsup: ([$p.reactions.nodes[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length),
                    comment_thumbsup: ([(.data.commentNode.reactions.nodes // [])[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length)
                  }'); then
              if grep -qi "could not resolve to a node" /tmp/poll-err.log 2>/dev/null; then
                echo "::warning::Transient error polling for a Codex signal -- retrying in 20s. $(cat /tmp/poll-err.log 2>/dev/null)"
                sleep 20
                continue
              fi
              echo "::error::Non-transient error polling for a Codex signal -- failing fast: $(cat /tmp/poll-err.log 2>/dev/null)"
              exit 1
            fi
            comments=$(echo "$poll" | jq '.comments')
            comment_head_tied=$(echo "$poll" | jq '.comment_head_tied')
            error_comments=$(echo "$poll" | jq '.error_comments')
            reviews=$(echo "$poll" | jq '.reviews')
            thumbsup=$(echo "$poll" | jq '.thumbsup')
            comment_thumbsup=$(echo "$poll" | jq '.comment_thumbsup')
            if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
              reviewed_head=1
            fi
            if [ "$IS_SYNC" = "true" ]; then
              # On a re-push specifically, a bare new issue comment or a
              # generic issue-level thumbsup is NOT proof Codex looked at
              # THIS head -- only accept signals provably tied to this
              # exact request. error_comments is deliberately NOT checked
              # on this branch, so an unscoped error from some earlier,
              # unrelated request can't fail the current push's still-
              # pending signal.
              if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
                echo "Codex responded on this revision: reviews=$reviews comment_thumbsup=$comment_thumbsup comment_head_tied=$comment_head_tied"
                responded=1
                break
              fi
            else
              # Check for a genuine success FIRST, error fail-fast
              # second: a manually re-run job reuses the original
              # event's cutoff, so an older transient Codex error and a
              # later real success can both be in-window on the same
              # poll.
              if [ "$comments" -gt 0 ] || [ "$reviews" -gt 0 ] || [ "$thumbsup" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ]; then
                echo "Codex responded on this revision: comments=$comments reviews=$reviews thumbsup=$thumbsup comment_thumbsup=$comment_thumbsup"
                responded=1
                break
              fi
              if [ "$error_comments" -gt 0 ]; then
                echo "::error::Codex reported an error (quota/auth/workspace/account-connection) instead of reviewing $HEAD_SHA -- failing now rather than waiting out the remaining timeout. Re-run this check once the underlying Codex issue is resolved."
                exit 1
              fi
            fi
            echo "Still waiting for Codex to respond to $HEAD_SHA..."
            sleep 20
          done
          if [ -z "$responded" ]; then
            echo "::error::Codex did not respond to $HEAD_SHA within 70 minutes"
            exit 1
          fi

          if [ "$IS_REMEDIATION" != "true" ]; then
            # Fail if any unresolved Codex-STARTED thread exists before
            # declaring success and applying codex-clean. Tested by the
            # thread's FIRST comment author (codex_initiated), not
            # "every comment is Codex," so a maintainer replying to a
            # brand-new Codex finding before this query runs can't hide
            # it.
            OWNER="${REPO%%/*}"
            NAME="${REPO##*/}"
            unresolved=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes { isResolved comments(first: 50) { nodes { author { login } } } }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
              | jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false)
                | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              ] | length')
            if [ "$unresolved" -gt 0 ]; then
              echo "::error::Codex's initial review left $unresolved unresolved concern(s) open -- resolve them, then push a remediation commit to trigger a fresh re-review."
              exit 1
            fi
            apply_clean_label
            exit 0
          fi

          # Auto-resolve/verdict computation ONLY on a genuine head-tied
          # review (not just any comment/reaction, which could be an
          # unrelated status message).
          if [ -z "$reviewed_head" ]; then
            echo "Codex responded, but not with a review tied to $HEAD_SHA specifically -- not auto-resolving anything."
            exit 0
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline=$(cat /tmp/codex-baseline-threads.json 2>/dev/null || echo '[]')
          baseline_initiated=$(cat /tmp/codex-baseline-initiated.json 2>/dev/null || echo '[]')

          # Re-fetch live thread state and compute, in one pass: new_count
          # (unresolved, PURE-CODEX threads NOT in baseline -- Codex raised
          # something brand new this round), restated_count (Codex
          # restating the SAME concern with a fresh comment IN an existing
          # baseline-initiated thread, rather than opening a new one --
          # new_count alone would miss this), unresolved_baseline_count
          # (baseline concerns still open, relevant on a non-genuine
          # rerun where nothing below resolves anything), and resolvable
          # (baseline threads still unresolved, still pure-Codex, and no
          # fresh Codex comment since RUN_STARTED).
          result=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      path
                      comments(first: 50) { nodes { author { login } createdAt originalCommit { oid } } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            | jq --argjson baseline "$baseline" --argjson baselineInitiated "$baseline_initiated" --arg since "$RUN_STARTED" '
              def ignorable_author: . == "chatgpt-codex-connector" or . == "github-actions";
              def codex_initiated: (.comments.nodes[0].author.login == "chatgpt-codex-connector");
              def restated_by_codex:
                [.comments.nodes[] | select(.author.login == "chatgpt-codex-connector" and .createdAt >= $since)] | length > 0;
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes
                  | map(select(.isResolved == false)
                        | select(codex_initiated)
                        | .id)) as $codex_unresolved
              | {
                  new_count: (($codex_unresolved - $baselineInitiated) | length),
                  restated_count: ([$nodes[]
                    | select(.isResolved == false)
                    | select(codex_initiated)
                    | select(.id as $id | $baselineInitiated | index($id))
                    | select(restated_by_codex)
                  ] | length),
                  unresolved_baseline_count: ([$codex_unresolved[] | select(. as $id | $baselineInitiated | index($id))] | length),
                  resolvable: [
                    $nodes[]
                    | select(.isResolved == false)
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(ignorable_author))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | {id, path, findingSha: (.comments.nodes[0].originalCommit.oid // "")}
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          restated_count=$(echo "$result" | jq '.restated_count')
          unresolved_baseline_count=$(echo "$result" | jq '.unresolved_baseline_count')

          # A nonzero new_count OR restated_count fails the check itself
          # (not a silent exit 0) -- this check's own name and green/red
          # status should mean what it says.
          if [ "$new_count" -gt 0 ]; then
            echo "::error::Codex raised $new_count new concern(s) on this revision -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi
          if [ "$restated_count" -gt 0 ]; then
            echo "::error::Codex restated $restated_count still-live concern(s) in an existing thread on this revision -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi
          # A non-genuine round (rerun or reopened-rerun of the SAME
          # code) never reaches the resolve loop below, so nothing is
          # going to clear a still-unresolved baseline concern.
          if [ "$IS_GENUINE_SYNC" != "true" ] && [ "$unresolved_baseline_count" -gt 0 ]; then
            echo "::error::This is a non-genuine round (rerun/reopened-rerun) with $unresolved_baseline_count still-unresolved baseline concern(s) that nothing here will clear -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi

          # This exact revision is genuinely clean (zero new/restated
          # Codex-raised concerns) -- true regardless of whether this
          # round is a fresh synchronize or a rerun/reopened-rerun of the
          # same head. Apply the label now, before the IS_GENUINE_SYNC
          # gate below decides whether auto-resolving threads is safe.
          apply_clean_label

          if [ "$IS_GENUINE_SYNC" != "true" ]; then
            echo "This round is a reopened/rerun, not a genuine synchronize -- the code hasn't changed, so not auto-resolving baseline threads that may still describe it (the label above still applies regardless -- this revision IS clean, just not safe to silently clear old findings against)."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[] | [.id, .path, .findingSha] | @tsv' | while IFS=$'\t' read -r thread_id path finding_sha; do
            [ -z "$thread_id" ] && continue
            # Confirm the flagged FILE was actually touched by a commit
            # landing after the finding was raised, via `git compare` +
            # ancestor verification, before doing any of the expensive/
            # mutating live-recheck work below. Without this, a clean
            # re-review triggered by a wholly unrelated commit satisfies
            # every other condition and auto-resolves a finding nobody
            # addressed. A missing findingSha fails safe: skip rather
            # than assume touched.
            if [ -z "$finding_sha" ]; then
              echo "::warning::Thread $thread_id has no recorded originating commit -- cannot confirm '$path' was touched since the finding was raised; leaving unresolved."
              continue
            fi
            if ! compare_response=$(gh api "repos/$REPO/compare/$finding_sha...$HEAD_SHA" 2>/tmp/compare-err.log); then
              echo "::warning::Could not compare $finding_sha...$HEAD_SHA for thread $thread_id -- cannot confirm '$path' was touched since the finding was raised; leaving unresolved: $(cat /tmp/compare-err.log 2>/dev/null)"
              continue
            fi
            # A rebase or force-push after the finding can leave
            # finding_sha queryable but no longer an ANCESTOR of
            # HEAD_SHA -- GitHub's three-dot compare doesn't fail on
            # that, it silently diffs from the merge base instead.
            merge_base=$(echo "$compare_response" | jq -r '.merge_base_commit.sha // ""')
            if [ "$merge_base" != "$finding_sha" ]; then
              echo "::warning::$finding_sha is not an ancestor of $HEAD_SHA (merge base: ${merge_base:-none}) -- branch history was likely rewritten since the finding; cannot trust this comparison's file list. Leaving thread $thread_id unresolved: $path"
              continue
            fi
            compare_files=$(echo "$compare_response" | jq '[.files[]? | (.filename, (.previous_filename // empty))]')
            if ! echo "$compare_files" | jq -e --arg path "$path" 'any(. == $path)' >/dev/null; then
              echo "Skipping thread $thread_id -- flagged file '$path' was not touched by any commit since the finding was raised (a clean re-review on an unrelated commit is not evidence this finding was fixed)."
              continue
            fi
            # Live-recheck immediately before the reply mutation: re-
            # verify resolved/pure/fresh state right before mutating, not
            # trusting the earlier $result snapshot -- a human can join
            # the thread in the gap between that snapshot and this loop
            # iteration reaching it.
            if ! live=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } createdAt } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck-err.log); then
              echo "::warning::Could not re-check thread $thread_id live state -- leaving unresolved: $(cat /tmp/live-recheck-err.log 2>/dev/null)"
              continue
            fi
            live_resolved=$(echo "$live" | jq -r '.data.node.isResolved')
            live_pure=$(echo "$live" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            live_fresh=$(echo "$live" | jq --arg since "$RUN_STARTED" '[.data.node.comments.nodes[] | select(.createdAt >= $since)] | length == 0')
            if [ "$live_resolved" != "false" ] || [ "$live_pure" != "true" ] || [ "$live_fresh" != "true" ]; then
              echo "Skipping thread $thread_id -- no longer eligible (resolved, human-touched, or a fresh comment landed since the snapshot)."
              continue
            fi
            pre_reply_count=$(echo "$live" | jq '.data.node.comments.nodes | length')
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id -- leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            # SECOND live-recheck immediately before the resolve
            # mutation, comparing exact comment COUNT (pre-reply + 1) to
            # detect anything landing in the reply-to-resolve gap --
            # this also rejects an unexpected DELETION landing in the
            # gap, which a pure freshness-timestamp re-check would not
            # catch.
            if ! live2=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck2-err.log); then
              echo "::warning::Could not re-verify thread $thread_id before resolving -- leaving unresolved: $(cat /tmp/live-recheck2-err.log 2>/dev/null)"
              continue
            fi
            post_reply_resolved=$(echo "$live2" | jq -r '.data.node.isResolved')
            post_reply_pure=$(echo "$live2" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            post_reply_count=$(echo "$live2" | jq '.data.node.comments.nodes | length')
            if [ "$post_reply_resolved" != "false" ] || [ "$post_reply_pure" != "true" ] || [ "$post_reply_count" -ne "$((pre_reply_count + 1))" ]; then
              echo "::warning::Thread $thread_id changed between reply and resolve -- leaving unresolved (has a reply, but not auto-resolved)."
              continue
            fi
            # GITHUB_TOKEN (github-actions[bot]) reliably fails this
            # specific mutation on a bot-started thread with "Resource
            # not accessible by integration"; RESOLVE_TOKEN (a real-user
            # PAT) does not have this restriction. Kept as a soft-skip
            # on failure rather than crashing the whole required check --
            # the reply above stays in place regardless, and a thread
            # that fails here stays eligible for a clean resolve on the
            # next round.
            if ! GH_TOKEN="$RESOLVE_TOKEN" gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done
