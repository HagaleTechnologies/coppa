# Coppa's own ruleset (gh api repos/HagaleTechnologies/coppa/rulesets/18627140)
# requires only "CI" and "Wait for Codex Review" -- NOT "Supply Chain".
# Mergify's rule-action only re-fires when a condition transitions from
# unmatched to matched, so a static condition list (base=main, -draft,
# -closed alone) that's already true the instant a PR opens fires once,
# immediately, and never gets a second chance once checks later go green.
# check-success/#review-threads-unresolved conditions give the rule
# something stateful to re-trigger on. The check-skipped OR-clause is
# needed because wait-for-codex.yml excludes dependabot[bot] pushes, so
# "Wait for Codex Review" reports `skipped`, not `success`, for those PRs
# -- without it, Dependabot PRs would never auto-queue. The needs-review
# label exclusion matters because dependabot-auto-merge.yml labels major-
# version dependency bumps "needs-review" and deliberately never enables
# auto-merge for them -- a queue tool with no concept of that label would
# silently defeat that policy.
#
# max_parallel_checks: 1 (required -- confirmed live on PR #94, #95 and #96:
# `@Mergifyio queue` rejected all three outright with "Configuration not
# compatible with a branch protection setting"): this repo's classic branch
# protection has `Require branches to be up to date before merging`
# (`strict: true`), which Mergify refuses to pair with its default draft-PR
# validation (a synthetic PR re-running checks against a merge-commit
# preview) -- that mode is fundamentally incompatible with "checks must have
# run against the exact up-to-date branch tip." max_parallel_checks: 1,
# combined with batch_size: 1 (already set below) and no separate
# merge_conditions (so queue admission and the final merge check are the
# same condition set), is what makes Mergify reuse the PR's own already-green
# checks in place instead of creating a draft PR -- see
# docs.mergify.com/merge-queue/rules, "in-place checks." Same fix already
# applied to manta's .mergify.yml, where it was confirmed live the same way.
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    update_method: rebase

pull_request_rules:
  - name: queue on green + threads resolved
    conditions:
      - base = main
      - -draft
      - -closed
      # coppa is public and its ruleset requires zero approving reviews
      # (required_approving_review_count: 0), so this Mergify rule is the
      # only gate standing between a green CI run and an auto-merge. With
      # no author condition, ANY outside contributor's PR that goes green
      # gets auto-queued and merged with zero human review. `author` is a
      # real, documented Mergify condition (exact match on the PR's GitHub
      # login) -- it is NOT the same trust boundary as ruleset
      # bypass_actors, which only governs who may bypass branch-protection
      # checks entirely, not who can trigger this auto-merge rule. Two
      # authors are trusted to auto-queue: thagale (today's sole human
      # collaborator), and dependabot[bot] -- but only for the non-breaking
      # bumps dependabot-auto-merge.yml has already vetted, since that
      # workflow labels major/breaking bumps "needs-review" and the
      # -label = needs-review condition below excludes those regardless of
      # author. Widen the author list (or replace it with an org/team
      # check) only when other human collaborators are added.
      - or:
          - author = thagale
          - author = dependabot[bot]
      - -label = needs-review
      - "#review-threads-unresolved = 0"
      - check-success = CI
      - or:
          - check-success = Wait for Codex Review
          - check-skipped = Wait for Codex Review
    actions:
      queue:
        name: default
