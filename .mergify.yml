extends: credenza

# Coppa's own ruleset (gh api repos/HagaleTechnologies/coppa/rulesets/18627140)
# requires only "CI" and "Wait for Codex Review" -- NOT "Supply Chain" (a
# real difference from widdershins/vanity's ruleset, which does require it).
# credenza's shared base rule includes a "check-success = Supply Chain"
# condition that would never be satisfiable here, permanently blocking
# auto-queue -- this local override (same rule name, one level of
# extension per credenza's own file header) replaces it with coppa's
# actual required-check set. Also adds the check-skipped OR-clause
# (needed because Task 1's exclude_dependabot: true makes "Wait for Codex
# Review" report `skipped`, not `success`, for Dependabot PRs -- without
# this OR-clause, Dependabot PRs would never auto-queue) and a
# needs-review label exclusion (Task 6's dependabot-auto-merge.yml labels
# major-version dependency bumps "needs-review" and deliberately never
# calls auto-merge for them -- a queue tool with no concept of that label
# would silently defeat the policy the old native workflow enforced,
# exactly the gap panino's own migration found).
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    update_method: rebase

pull_request_rules:
  - name: queue on green + threads resolved
    conditions:
      - base = main
      - -draft
      - -closed
      - -label = needs-review
      - "#review-threads-unresolved = 0"
      - check-success = CI
      - or:
          - check-success = Wait for Codex Review
          - check-skipped = Wait for Codex Review
    actions:
      queue:
        name: default
