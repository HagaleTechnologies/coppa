# A modem the black-box harness launches twice, unmodified.
# coppad opens its ALSA device as f32le, 48000 Hz, mono ([audio] below).
name = "coppad"
adapter = "vara"
binary = "target/release/coppad"
sha256 = ""
mode = "HF_STANDARD"
args = ["--config", "{dir}/coppad.toml"]
ready_timeout_s = 20

# COP-221: the format the modem opens its ALSA device in. The relay converts
# between it and the channel's f32le 48000 Hz mono. format: f32le or s16le;
# rate: 8000, 12000, 16000, 24000 or 48000; channels: 1.
[audio]
format = "f32le"
rate = 48000
channels = 1

[ports]
log_line = "VARA TCP server listening"
command_key = "command_addr="
data_key = "data_addr="

[[files]]
path = "{dir}/coppad.toml"
contents = """
[audio]
sample_rate = 48000
buffer_size = 16384
input_device = "{device}"
output_device = "{device}"

[radio]
ptt_method = "none"

[host]
bind_address = "127.0.0.1"
vara_enabled = true
vara_command_port = 0
vara_data_port = 0

[engine]
profile = "HF_STANDARD"
callsign = "{call}"
"""
