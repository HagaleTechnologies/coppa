# KISS datagram interface to the same unmodified coppad binary.
# KISS datagrams are never resent, so each station's receive ring must
# outlast coppad's inline decode on a busy host: 16384 samples (0.34 s)
# lost a datagram with 4 busy loops on 2 CPUs, 131072 (2.7 s) did not
# (COP-244, docs/LIMITATIONS.md).
name = "coppad-kiss"
adapter = "kiss"
binary = "target/release/coppad"
sha256 = ""
mode = "HF_STANDARD"
args = ["--config", "{dir}/coppad.toml"]
ready_timeout_s = 20
datagram_bytes = 900

# COP-221: the format the modem opens its ALSA device in. The relay converts
# between it and the channel's f32le 48000 Hz mono. format: f32le or s16le;
# rate: 8000, 12000, 16000, 24000 or 48000; channels: 1.
[audio]
format = "f32le"
rate = 48000
channels = 1

[ports]
log_line = "KISS datagram interface listening"
command_key = "addr="
data_key = "addr="

[[files]]
path = "{dir}/coppad.toml"
contents = """
[audio]
sample_rate = 48000
buffer_size = 131072
input_device = "{device}"
output_device = "{device}"

[radio]
ptt_method = "none"

[host]
bind_address = "127.0.0.1"
kiss_enabled = true
kiss_port = 0

[engine]
profile = "HF_STANDARD"
callsign = "{call}"
"""
