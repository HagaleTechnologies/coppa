# KISS datagram interface to the same unmodified coppad binary.
name = "coppad-kiss"
adapter = "kiss"
binary = "target/release/coppad"
sha256 = ""
mode = "HF_STANDARD"
args = ["--config", "{dir}/coppad.toml"]
ready_timeout_s = 20
datagram_bytes = 900

[ports]
log_line = "KISS datagram interface listening"
command_key = "addr="
data_key = "addr="

[[files]]
path = "{dir}/coppad.toml"
contents = """
[audio]
sample_rate = 48000
buffer_size = 16384
input_device = "{device}"
output_device = "{device}"

[radio]
ptt_method = "none"

[host]
bind_address = "127.0.0.1"
kiss_enabled = true
kiss_port = 0

[engine]
profile = "HF_STANDARD"
callsign = "{call}"
"""
