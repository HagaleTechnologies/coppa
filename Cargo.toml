[workspace]
members = [
    "crates/coppa-dsp",
    "crates/coppa-codec",
    "crates/coppa-protocol",
    "crates/coppa-channel",
    "crates/coppa-audio",
    "crates/coppa-radio",
    "crates/coppa-ml",
    "crates/coppa-engine",
    "crates/coppa-host",
    "crates/coppa-ffi",
    "crates/coppa-cli",
    "crates/coppa-daemon",
    "crates/coppa-bench",
    "tools/gen_nr_bg2",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

# COP-90 (H-135). Inherited by every package except coppa-audio (five
# `unsafe impl Send`) and coppa-ffi (the C ABI). Cargo cannot combine
# `[lints] workspace = true` with local overrides, so crate-specific lints
# (missing_docs and friends) live in each crate's lib.rs instead.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
return_self_not_must_use = "warn"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0"
crc = "3.2"
rand = "0.10"
num-complex = "0.4"
rustfft = "6.2"
approx = "0.5"
smallvec = "1.13"
rtrb = "0.4"
cpal = "0.18"
hound = "3.5"
serialport = "4.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
lz4_flex = "0.14"
proptest = "1.5"
criterion = { version = "0.8", features = ["html_reports"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Root package for workspace-level integration tests
[package]
name = "coppa"
version = "0.16.0"
edition = "2021"
description = "Open-source ham radio digital communications system"
license = "MIT OR Apache-2.0"

[dependencies]
coppa-engine = { path = "crates/coppa-engine" }
coppa-codec = { path = "crates/coppa-codec" }
coppa-protocol = { path = "crates/coppa-protocol" }
coppa-dsp = { path = "crates/coppa-dsp" }

[dev-dependencies]
serde_json = { workspace = true }
coppa-bench = { path = "crates/coppa-bench" }
coppa-channel = { path = "crates/coppa-channel" }
coppa-audio = { path = "crates/coppa-audio" }
num-complex = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "throughput"
harness = false

# Optimize DSP-heavy CI simulations without weakening runtime checks.
[profile.ci]
inherits = "test"
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true
incremental = false
