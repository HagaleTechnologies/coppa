[package]
name = "coppa-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Measurement harness: BER/FER/goodput-vs-SNR for Coppa PHY modes"
# COP-90 (H-137): the measurement programs live in diagnostics/, one
# [[example]] stanza each; tests/diagnostics_registered.rs keeps them in step.
autoexamples = false

[dependencies]
coppa-codec = { path = "../coppa-codec" }
coppa-protocol = { path = "../coppa-protocol" }
coppa-channel = { path = "../coppa-channel" }
coppa-ml = { path = "../coppa-ml" }
# default-features = false: coppa-audio's defaults turn on cpal-backend (ALSA on
# Linux). The COP-112 TNC benchmark needs only the WAV file backend and the resampler.
coppa-audio = { path = "../coppa-audio", default-features = false, features = ["file-backend"] }
anyhow = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
num-complex = { workspace = true }
hound = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
crc = { workspace = true }

[lints]
workspace = true

