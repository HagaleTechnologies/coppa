[package]
name = "coppa-cli"
description = "CLI binary for Coppa digital communications"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# COP-47: `cargo binstall --git https://github.com/HagaleTechnologies/coppa coppa-cli@<version>`
# installs from the GitHub Release archive. The archive names and layout are a
# contract with every past release (tools/release/release.py, docs/RELEASING.md).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/coppa-{ version }-{ target }{ archive-suffix }"
bin-dir = "coppa-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

[[bin]]
name = "coppa"
path = "src/main.rs"
# COP-88: the root `coppa` lib owns target/doc/coppa; documenting this bin too
# is a cargo output filename collision (rust-lang/cargo#6313).
doc = false

[dependencies]
coppa-engine = { path = "../coppa-engine" }
# default-features = false: coppa-audio's defaults turn on cpal-backend (ALSA on
# Linux). This crate enables each backend only through its own features (COP-63).
coppa-audio = { path = "../coppa-audio", default-features = false }
coppa-radio = { path = "../coppa-radio" }
coppa-codec = { path = "../coppa-codec" }
coppa-protocol = { path = "../coppa-protocol" }
coppa-host = { path = "../coppa-host" }
coppa-daemon = { path = "../coppa-daemon" }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Golden-vector manifest parsing (tests/rx_golden.rs), matching
# crates/coppa-protocol/tests/golden_vectors.rs's approach.
toml = { workspace = true }

[features]
default = ["file-backend"]
file-backend = ["coppa-audio/file-backend"]
cpal-backend = ["coppa-audio/cpal-backend", "coppa-daemon/cpal-backend"]
kiss-tnc = ["coppa-host/kiss-tnc", "coppa-daemon/kiss-tnc"]
