[package]
name = "coppa-daemon"
description = "Long-running daemon for Coppa"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# COP-47: `cargo binstall --git https://github.com/HagaleTechnologies/coppa coppa-daemon@<version>`
# installs from the GitHub Release archive. The archive names and layout are a
# contract with every past release (tools/release/release.py, docs/RELEASING.md).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/coppa-{ version }-{ target }{ archive-suffix }"
bin-dir = "coppa-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

[[bin]]
name = "coppad"
path = "src/main.rs"

[lib]
name = "coppa_daemon"
path = "src/lib.rs"

[[test]]
name = "pat_ardop_session"
required-features = ["ardop"]

[[test]]
name = "kiss_datagram"
required-features = ["kiss-tnc"]

[dependencies]
coppa-engine = { path = "../coppa-engine" }
# default-features = false: coppa-audio's defaults turn on cpal-backend (ALSA on
# Linux). This crate enables each backend only through its own features (COP-63).
coppa-audio = { path = "../coppa-audio", default-features = false }
coppa-radio = { path = "../coppa-radio" }
coppa-host = { path = "../coppa-host" }
coppa-protocol = { path = "../coppa-protocol" }
coppa-codec = { path = "../coppa-codec" }
coppa-dsp = { path = "../coppa-dsp" }
coppa-ml = { path = "../coppa-ml" }
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# COP-140: mDNS responder for coppad.local; pure Rust, no system daemon.
mdns-sd = { version = "0.21", optional = true }

[dev-dependencies]
# COP-140: the round-trip test browses and resolves with the same crate.
mdns-sd = "0.21"
futures-util = "0.3"
tokio-tungstenite = "0.29"
coppa-channel = { path = "../coppa-channel" }
# COP-126: the golden-vector receive test reads the committed WAVs.
hound = { workspace = true }
# test-util: only pulled in for test builds (Cargo dev-dependency feature
# unification under resolver = "2" doesn't leak into the release binary) --
# needed for `#[tokio::test(start_paused = true)]` / `tokio::time::advance`
# in Task 3's busy-gate-holdoff tests, so timer waits resolve deterministically
# without consuming real wall-clock time.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
cpal-backend = ["coppa-audio/cpal-backend"]
websocket = ["coppa-host/websocket", "dep:serde_json"]
kiss-tnc = ["coppa-host/kiss-tnc"]
ardop = ["coppa-host/ardop"]
serial-ptt = ["coppa-radio/serial-ptt"]
gpio-ptt = ["coppa-radio/gpio-ptt"]
# mDNS needs the WebSocket listener: it advertises that port and nothing else.
mdns = ["websocket", "dep:mdns-sd"]
