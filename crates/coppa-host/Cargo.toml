[package]
name = "coppa-host"
description = "Host interfaces (TCP, WebSocket) for Coppa"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
coppa-engine = { path = "../coppa-engine" }
# COP-121: the WebSocket task pre-checks chat text with `app_stream::check_chat_text`.
coppa-protocol = { path = "../coppa-protocol" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = { version = "0.3", optional = true }
# COP-79: parses the request head before routing; already in the graph via tungstenite.
httparse = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
schemars = { version = "1.2.3", optional = true }

[features]
default = ["vara-tcp"]
vara-tcp = []
websocket = [
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:httparse",
    "dep:base64",
    "dep:schemars",
]
kiss-tnc = []
ardop = []

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }

[lints]
workspace = true
